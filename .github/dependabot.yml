# Keeps the GitHub Actions versions in .github/workflows current (CI 3.5).
# Dependabot checks weekly and opens a pull request only when an action has a new version;
# all such updates arrive together in one pull request, which runs ci.yml like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
