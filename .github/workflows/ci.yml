# Pull-request checks (CI 3.3, docs/plans/v2.3/ROADMAP.md).
#
# changes: decides whether the change needs test and size. They skip when every changed file is
# documentation or tooling that no test reads (scripts/ci-changes.js has the list). Release runs
# and pushes without a base always test.
#
# test: npm test on Linux and Windows for every pull request and push to main, and on macOS for
# pushes to main. Realtime audio suites are skipped (no runner has a usable audio device), and
# macOS runs the visual suites in report-only pixel mode, because its SwiftShader backend
# differs from the baselines (G4). GitHub sets CI, so playwright.config.js retries a failure
# once and fails on flaky tests. The same job then runs the Firefox check (task 3.4).
#
# size: builds the base and the change and writes the size diff to the job summary.
#
# ci: the required check. It passes when changes, test, and size each succeeded or were skipped.
#
# release.yml runs this workflow as its test stage (workflow_call), with macOS included.
name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; runs on main all complete
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.decide.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The base is the pull request's base or, for a push to a branch, the previous commit.
      # Release runs, tag pushes, new branches, and a base that cannot be fetched (after a
      # force-push) run the tests.
      - name: Decide
        id: decide
        env:
          BASE_SHA: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event_name == 'push' && startsWith( github.ref, 'refs/heads/' ) &&
            github.event.before || '' }}
        run: |
          tests=true
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]
          then
            echo "No base commit: running the tests." >> "$GITHUB_STEP_SUMMARY"
          elif git fetch --no-tags --depth=1 origin "$BASE_SHA" &&
            files=$( git diff --name-only "$BASE_SHA" "$GITHUB_SHA" )
          then
            tests=$( printf '%s\n' "$files" | node scripts/ci-changes.js )
            {
              echo "Changed files:"
              echo '```'
              printf '%s\n' "$files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cannot diff against $BASE_SHA: running the tests." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Tests needed: $tests" >> "$GITHUB_STEP_SUMMARY"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2025, macos-15 ]

        # macOS runs on pushes to main only; an empty value excludes nothing
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-15' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PI_AUDIO_REALTIME: "0"
      PI_VISUAL_PIXELS: ${{ matrix.os == 'macos-15' && 'report' || 'fail' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Linux installs the browsers with their system libraries. Windows and macOS restore
      # the browsers from a cache keyed on the locked Playwright version.
      - name: Playwright version and browser path
        id: playwright
        run: |
          echo "version=$( npx playwright --version | cut -d ' ' -f 2 )" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "path=~/AppData/Local/ms-playwright" >> "$GITHUB_OUTPUT"
          else
            echo "path=~/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT"
          fi
      - name: Browser cache
        if: runner.os != 'Linux'
        uses: actions/cache@v6
        with:
          path: ${{ steps.playwright.outputs.path }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browsers
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install chromium firefox webkit
          fi

      - run: npm test

      # Firefox's release checks, run even when npm test fails. Firefox gets WebGL2 through
      # webgl.force-enabled on Windows; on Linux only headed, under Xvfb with Mesa (task 2.6).
      - name: Firefox check
        if: ${{ !cancelled() }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends xvfb libegl1 libegl-mesa0 libgles2
            PI_FIREFOX_HEADED=true xvfb-run -a npm run test:firefox
          else
            npm run test:firefox
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test/test-results/
            test/playwright-report/
          retention-days: 14

  size:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Size of the change
        run: |
          npm ci --no-audit --no-fund
          npm run size -- --out="$RUNNER_TEMP/head.json"

      # The base is the pull request's base or the previous commit on main. A push that creates
      # a branch or tag, and a manual release run, have none, so they skip the diff.
      - name: Base commit
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]
          then
            echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the base
        if: steps.base.outputs.sha != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
      - name: Size of the base
        if: steps.base.outputs.sha != ''
        working-directory: base
        run: |
          npm ci --no-audit --no-fund
          npm run size -- --out="$RUNNER_TEMP/base.json"
      - name: Size diff
        if: steps.base.outputs.sha != ''
        run: |
          node scripts/size-diff.js "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" \
            >> "$GITHUB_STEP_SUMMARY"

  # The single required check: a failure, a cancellation, or a failed changes job fails it
  ci:
    needs: [ changes, test, size ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Results
        env:
          RESULTS: ${{ join( needs.*.result, ' ' ) }}
        run: |
          echo "changes, test, size: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A CI job ended with $result."
              exit 1
            fi
          done
