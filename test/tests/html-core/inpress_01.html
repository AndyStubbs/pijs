<!DOCTYPE html>
<html>
	<head>
		<title>Inpress 01</title>
		<script type="text/toml">
			[[TOML_START]]
			file = "inpress_01"
			name = "inpress 01"
			width = 160
			height = 100
			commands = """
				MV 10, 10
				MD
				MV 70, 90, 15
				MU
				SL "canvas"
				TS 90, 10
				TM 150, 90, 15
				TE
			"""
			[[TOML_END]]
		</script>
		<script src="../../../build/pi.js"></script>
		<style>
			html, body {
				color: white;
				background-color: blue;
				margin: 10px;
			}
		</style>
	</head>
<body>

<script>
	$.ready( function () {
		var last = { x: 0, y: 0 };
		var isDrawing = false;
		$.screen( "160x100" );
		$.set( { "contextMenu": false } );
		$.setColor( 16 );
		$.rect( 0, 0, 8, 14 );
		$.paint( 1, 1, 16 );
		$.setColor( 15 );

		// Read the press after every pointer event, once the plugin has seen it, so each state
		// is drawn once whatever the timing. A press captures its pointer, so the release
		// arrives at the canvas too
		draw();
		for( var type of [ "pointerdown", "pointermove", "pointerup", "pointercancel" ] ) {
			$.canvas().addEventListener( type, draw );
		}

		function draw() {
			$.cls( 0, 0, 75, 8 );
			var mouse = $.inPress();
			if( mouse === null ) {
				return;
			}
			$.setPos( 0, 0 );
			$.print( `${mouse.buttons} (${mouse.x}, ${mouse.y})` );
			if( mouse.buttons > 0 ) {
				if( !isDrawing ) {
					$.pset( mouse.x, mouse.y );
				} else if( mouse.x !== last.x || mouse.y !== last.y ) {
					$.line( last.x, last.y, mouse.x, mouse.y );
				}
				last.x = mouse.x;
				last.y = mouse.y;
				isDrawing = true;
			} else {
				isDrawing = false;
			}
		}
	} );
</script>

</body>
</html>
