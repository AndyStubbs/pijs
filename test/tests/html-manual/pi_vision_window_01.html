<!DOCTYPE html>
<html>
	<head>
		<title>Pi Vision Window Management Manual Test</title>
		<script type="text/toml">
			[[TOML_START]]
			file = "pi_vision_window_01"
			name = "Pi Vision Window Management Manual Test"
			width = 640
			height = 360
			delay = 0
			[[TOML_END]]
		</script>
		<script src="../../../build/pi.js"></script>
		<script src="../../../build/plugins/pi-vision/pi-vision.js"></script>
		<style>
			html, body {
				background-color: #333;
				margin: 0;
				padding: 0;
			}
			#metrics {
				background: rgba( 0, 0, 0, 0.8 );
				color: #fff;
				font: 12px/1.4 monospace;
				padding: 6px 8px;
				pointer-events: none;
				position: fixed;
				right: 0;
				top: 0;
				white-space: pre;
				z-index: 2;
			}
		</style>
	</head>
<body>
<output id="metrics">Warming up...</output>
<script>
	const desktop = $.screen( "640x360" );
	const windowScreens = [];
	const renderSamples = [];
	const frameSamples = [];
	let rootRenderCount = 0;
	let lastFrameTime = null;
	let lastMetricsTime = 0;
	let lastMetricsRenderCount = 0;

	$.ready( function() {
		$.vis.onRender( ( screen ) => {
			rootRenderCount += 1;
			screen.setColor( 8 );
			screen.setPosPx( 8, 344 );
			screen.print( "Pi Vision window management" );
		} );
		createWindow( {
			"x": 24, "y": 24, "width": 190, "height": 112,
			"title": "Drag Me", "color": 1, "accent": 14,
			"draw": ( screen ) => {
				screen.line( 4, 4, screen.width() - 5, screen.height() - 5, 14 );
				screen.line( screen.width() - 5, 4, 4, screen.height() - 5, 14 );
			}
		} );
		createWindow( {
			"x": 234, "y": 24, "width": 176, "height": 112,
			"title": "Resize Me", "color": 2, "accent": 10,
			"draw": ( screen ) => {
				screen.rect( 8, 8, 48, 32, 10 );
				screen.rect( 64, 8, 48, 32, 14 );
			}
		} );
		createWindow( {
			"x": 430, "y": 24, "width": 176, "height": 112,
			"title": "Close Me", "color": 4, "accent": 12
		} );

		let vetoClose = true;
		createWindow( {
			"x": 24, "y": 164, "width": 190, "height": 112,
			"title": "Veto Once", "color": 3, "accent": 11,
			"beforeClose": () => {
				if( vetoClose ) {
					vetoClose = false;
					return false;
				}
				return true;
			}
		} );

		$.setScreen( desktop );
		const parentWindow = createWindow( {
			"x": 234, "y": 164, "width": 372, "height": 168,
			"title": "Parent", "color": 5, "accent": 13
		} );
		$.setScreen( parentWindow );
		createWindow( {
			"x": 24, "y": 16, "width": 150, "height": 96,
			"title": "Child", "color": 6, "accent": 15,
			"shadow": false
		} );

		$.setScreen( desktop );
		function frame( time ) {
			if( lastFrameTime !== null ) {
				addSample( frameSamples, time - lastFrameTime );
			}
			lastFrameTime = time;
			const renderStart = performance.now();
			//$.vis.render();
			addSample( renderSamples, performance.now() - renderStart );
			if( time - lastMetricsTime >= 500 ) {
				updateMetrics( time );
			}
			requestAnimationFrame( frame );
		}
		requestAnimationFrame( frame );
	} );

	function createWindow( options ) {
		const draw = options.draw;
		options.mode = "interactive";
		if( options.border == null ) {
			options.border = "double";
		}
		if( options.shadow == null ) {
			options.shadow = true;
		}
		options.onRender = ( screen ) => {
			screen.setColor( options.color );
			screen.rect( 0, 0, screen.width(), screen.height(), options.color );
			screen.setColor( options.accent );
			screen.rect( 8, 8, 24, 16, options.accent );
			if( draw ) {
				draw( screen );
			}
		};
		const windowScreen = $.vis.window( options );
		windowScreens.push( windowScreen );
		return windowScreen;
	}

	function addSample( samples, value ) {
		samples.push( value );
		if( samples.length > 120 ) {
			samples.shift();
		}
	}

	function percentile( samples, ratio ) {
		if( samples.length === 0 ) {
			return 0;
		}
		const sorted = [ ...samples ].sort( ( first, second ) => first - second );
		const index = Math.min( Math.floor( sorted.length * ratio ), sorted.length - 1 );
		return sorted[ index ];
	}

	function countOpenWindows() {
		let count = 0;
		for( const screen of windowScreens ) {
			try {
				screen.width();
				count += 1;
			} catch( _error ) {}
		}
		return count;
	}

	function updateMetrics( time ) {
		const elapsed = time - lastMetricsTime;
		const renders = rootRenderCount - lastMetricsRenderCount;
		const frameMedian = percentile( frameSamples, 0.5 );
		const renderMedian = percentile( renderSamples, 0.5 );
		const renderP95 = percentile( renderSamples, 0.95 );
		const fps = frameMedian > 0 ? 1000 / frameMedian : 0;
		const rendersPerSecond = elapsed > 0 ? renders * 1000 / elapsed : 0;
		document.getElementById( "metrics" ).textContent = "" +
			`FPS: ${fps.toFixed( 1 )}\n` +
			`Render median: ${renderMedian.toFixed( 2 )} ms\n` +
			`Render p95: ${renderP95.toFixed( 2 )} ms\n` +
			`Windows: ${countOpenWindows()}\n` +
			`Renders: ${rootRenderCount} (${rendersPerSecond.toFixed( 1 )}/s)`;
		lastMetricsTime = time;
		lastMetricsRenderCount = rootRenderCount;
	}
</script>
</body>
</html>
