<!DOCTYPE html>
<html>
	<head>
		<title>Ontouch 03</title>
		<script type="text/toml">
			[[TOML_START]]
			test = "screenshot.js"
			file = "ontouch_03"
			name = "ontouch 03"
			width = 320
			height = 200
			delay = 0
			[[TOML_END]]
		</script>
		<script src="../../../build/pi.js"></script>
		<style>
			html, body {
				background-color: grey;
			}
		</style>
	</head>
<body>
<script>
$.ready( function () {
	function clamp( value, min, max ) {
		return Math.min( Math.max( value, min ), max );
	}
	var hitbox = {
		x: 25, y: 25, width: 100, height: 100
	};
	$.screen( "320x200" );
	$.startTouch();
	$.setPinchZoom( false );
	$.rect( hitbox.x, hitbox.y, hitbox.width, hitbox.height );
	$.setColor( 2 );
	
	$.onTouch( "start", function ( touches, customData ) {
		var i, touch;
		console.log( customData );
		for( i = 0; i < touches.length; i++ ) {
			touch = touches[ i ];
			$.pset( touch.x, touch.y );
		}
	}, false, hitbox, "Touch Start" );
	$.onTouch( "move", function ( touches ) {
		var i, touch;
		for( i = 0; i < touches.length; i++ ) {
			touch = touches[ i ];
			touch.lastX = clamp( touch.lastX, hitbox.x, hitbox.x + hitbox.width );
			touch.lastY = clamp( touch.lastY, hitbox.y, hitbox.y + hitbox.height );
			if( touch.lastX ) {
				$.line( touch.x, touch.y, touch.lastX, touch.lastY );
			}
		}
	}, false, hitbox );
	$.onTouch( "end", function ( touches ) {
		var i, touch;
		for( i = 0; i < touches.length; i++ ) {
			touch = touches[ i ];
			if( touch.lastX ) {
				$.line( touch.x, touch.y, touch.lastX, touch.lastY );
			}
		}
	}, false, hitbox );
} );
</script>
</body>
</html>
