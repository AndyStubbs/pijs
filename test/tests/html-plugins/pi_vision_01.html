<!DOCTYPE html>
<html>
	<head>
		<title>Pi Vision Window Smoke Test</title>
		<script type="text/toml">
			[[TOML_START]]
			file = "pi_vision_01"
			name = "Pi Vision Window Smoke Test"
			width = 320
			height = 180
			delay = 100
			[[TOML_END]]
		</script>
		<script src="../../../build/pi.js"></script>
		<script src="../../../build/plugins/pi-vision/pi-vision.js"></script>
		<style>
			html, body {
				background-color: #333;
				margin: 0;
				padding: 0;
			}
		</style>
	</head>
<body>
<script>
	let testPluginApi;
	$.registerPlugin( {
		"name": "pi-vision-test",
		"version": "1.0.0",
		"description": "Inspects Pi Vision window screen contexts.",
		"dependencies": [],
		"init": ( pluginApi ) => {
			testPluginApi = pluginApi;
		}
	} );
	const main = $.screen( "320x180" );

	$.ready( async function() {
		const failures = [];
		let borderedRenderCount = 0;

		check( $.vis && typeof $.vis.window === "function", "$.vis.window exists" );
		check( typeof $.vis.render === "function", "$.vis.render exists" );
		check( typeof $.vis.onRender === "function", "$.vis.onRender exists" );

		const mainData = testPluginApi.getScreenData( "pi-vision-test", main.id );
		const staticDefault = $.vis.window( {
			"x": 4,
			"y": 4,
			"width": 91,
			"height": 49,
			"title": "Not rendered"
		} );
		const staticData = testPluginApi.getScreenData(
			"pi-vision-test", staticDefault.id
		);
		const staticRecord = staticData.vis.element;
		check( staticRecord.mode === "static", "default window mode is static" );
		check( staticRecord.border === "none", "default window is borderless" );
		check( staticRecord.shadow === false, "default window has no shadow" );
		check( staticRecord.chrome === null, "static borderless window omits chrome" );
		check( mainData.vis.interaction === null, "static window adds no interaction handlers" );
		check( staticDefault.width() === 91, "static client uses full width" );
		check( staticDefault.height() === 49, "static client uses full height" );
		const staticOrigin = staticDefault.viewToScreen( 0, 0 );
		check( staticOrigin.x === 0 && staticOrigin.y === 0, "static client starts at origin" );
		staticDefault.move( 6, 7 );
		check( staticRecord.x === 6 && staticRecord.y === 7, "script moves static window" );
		staticDefault.resize( 103, 61 );
		check(
			staticDefault.width() === 103 && staticDefault.height() === 61,
			"script resizes static window exactly"
		);
		check( staticDefault.close() === true, "script closes static window" );

		const staticBordered = $.vis.window( {
			"x": 4,
			"y": 4,
			"width": 78,
			"height": 48,
			"title": "Fixed",
			"border": "single"
		} );
		const staticBorderedRecord = testPluginApi.getScreenData(
			"pi-vision-test", staticBordered.id
		).vis.element;
		check(
			!staticBorderedRecord.chrome.top.includes( "[X]" ),
			"static bordered window omits close button"
		);
		check( mainData.vis.interaction === null, "bordered static window adds no handlers" );
		staticBordered.close();

		const bordered = $.vis.window( {
			"x": 12,
			"y": 16,
			"width": 120,
			"height": 80,
			"mode": "interactive",
			"border": "double",
			"shadow": true,
			"onRender": drawBordered
		} );

		check( bordered && bordered.screen === true, "window returns a screen" );
		check( typeof bordered.render === "function", "window render exists" );
		check(
			testPluginApi.getScreenData( "pi-vision-test", bordered.id ).gl ===
				testPluginApi.getScreenData( "pi-vision-test", main.id ).gl,
			"top-level window uses parent context"
		);
		check( $.width() === 320 && $.height() === 180, "parent screen remains active" );
		check( bordered.width() === 108, "bordered client width" );
		check( bordered.height() === 64, "bordered client height" );

		const borderedOrigin = bordered.viewToScreen( 0, 0 );
		check( borderedOrigin.x === 6 && borderedOrigin.y === 8, "bordered client origin" );

		const titled = $.vis.window( {
			"x": 20,
			"y": 24,
			"width": 90,
			"height": 48,
			"mode": "interactive",
			"title": "Title",
			"border": "none",
			"shadow": false,
			"onRender": ( screen ) => {
				screen.setColor( 3 );
				screen.rect( 0, 0, screen.width(), screen.height(), 3 );
			}
		} );

		check( titled.width() === 90, "borderless client width" );
		check( titled.height() === 40, "borderless title height" );

		const titledOrigin = titled.viewToScreen( 0, 0 );
		check( titledOrigin.x === 0 && titledOrigin.y === 8, "borderless title origin" );

		bordered.setColor( 1 );
		bordered.rect( 0, 0, bordered.width(), bordered.height(), 1 );
		bordered.setColor( 14 );
		bordered.line( 2, 2, bordered.width() - 3, bordered.height() - 3 );
		bordered.setPos( 1, 1 );
		bordered.print( "Pi.js" );

		titled.setColor( 3 );
		titled.rect( 0, 0, titled.width(), titled.height(), 3 );

		const single = $.vis.window( {
			"x": 142,
			"y": 8,
			"width": 78,
			"height": 56,
			"mode": "interactive",
			"title": "Single",
			"border": "single",
			"shadow": true,
			"onRender": ( screen ) => {
				screen.setColor( 2 );
				screen.rect( 0, 0, screen.width(), screen.height(), 2 );
			}
		} );
		single.setColor( 2 );
		single.rect( 0, 0, single.width(), single.height(), 2 );

		const thick = $.vis.window( {
			"x": 232,
			"y": 8,
			"width": 78,
			"height": 56,
			"mode": "interactive",
			"title": "Thick title clipped",
			"border": "thick",
			"shadow": false,
			"onRender": ( screen ) => {
				screen.setColor( 4 );
				screen.rect( 0, 0, screen.width(), screen.height(), 4 );
			}
		} );
		thick.setColor( 4 );
		thick.rect( 0, 0, thick.width(), thick.height(), 4 );

		$.setScreen( main );
		const container = $.vis.window( {
			"x": 142,
			"y": 82,
			"width": 138,
			"height": 80,
			"mode": "interactive",
			"title": "Container",
			"border": "double",
			"shadow": false,
			"onRender": ( screen ) => {
				screen.setColor( 5 );
				screen.rect( 0, 0, screen.width(), screen.height(), 5 );
			}
		} );
		container.setColor( 5 );
		container.rect( 0, 0, container.width(), container.height(), 5 );

		$.setScreen( container );
		const child = $.vis.window( {
			"x": 12,
			"y": 8,
			"width": 66,
			"height": 40,
			"mode": "interactive",
			"title": "Child",
			"border": "single",
			"shadow": false,
			"onRender": ( screen ) => {
				screen.setColor( 6 );
				screen.rect( 0, 0, screen.width(), screen.height(), 6 );
			}
		} );
		check(
			testPluginApi.getScreenData( "pi-vision-test", child.id ).gl ===
				testPluginApi.getScreenData( "pi-vision-test", container.id ).gl,
			"nested window uses parent context"
		);
		child.setColor( 6 );
		child.rect( 0, 0, child.width(), child.height(), 6 );

		$.setScreen( main );
		const activeBeforeRender = $.width();
		$.vis.render( false );
		check( $.width() === activeBeforeRender, "render preserves active screen" );
		check( $.getPixel( 167, 107, true ) === 5, "recursive false skips child" );
		$.vis.render();
		check( $.getPixel( 167, 107, true ) === 6, "recursive true renders child" );

		const temporary = $.vis.window( {
			"x": 300, "y": 160, "width": 18, "height": 24,
			"border": "double", "shadow": false
		} );
		temporary.removeScreen();
		const normalizedWindow = $.vis.window( {
			"x": 180, "y": 100, "width": 91, "height": 49,
			"border": "double", "shadow": false
		} );
		check( normalizedWindow.width() === 78, "bordered width snaps to font cells" );
		check( normalizedWindow.height() === 32, "bordered height snaps to font cells" );
		normalizedWindow.resize( 103, 61 );
		check( normalizedWindow.width() === 90, "programmatic resize snaps width" );
		check( normalizedWindow.height() === 48, "programmatic resize snaps height" );
		normalizedWindow.removeScreen();
		$.setScreen( main );
		$.vis.render();
		checkThrows(
			() => $.vis.window( { "y": 0, "width": 90, "height": 48 } ),
			"required x"
		);
		checkThrows(
			() => $.vis.window( { "x": 0, "y": 0, "width": 90, "height": 48,
				"border": "invalid" } ),
			"invalid border"
		);
		checkThrows(
			() => $.vis.window( { "x": 0, "y": 0, "width": 12, "height": 8,
				"mode": "invalid" } ),
			"invalid mode",
			"INVALID_WINDOW_MODE"
		);
		checkThrows(
			() => $.vis.window( { "x": 0, "y": 0, "width": 12, "height": 8,
				"mode": true } ),
			"invalid mode type",
			"INVALID_WINDOW_MODE"
		);

		const explicitRenderCount = borderedRenderCount;
		$.vis.render();
		$.vis.render();
		check(
			borderedRenderCount === explicitRenderCount + 2,
			"explicit render callbacks stay live"
		);

		const canvas = $.canvas();
		const canvasRect = canvas.getBoundingClientRect();
		const dispatchMouse = ( type, x, y, buttons ) => {
			canvas.dispatchEvent( new MouseEvent( type, {
				"bubbles": true,
				"buttons": buttons,
				"clientX": canvasRect.left + x / 320 * canvasRect.width,
				"clientY": canvasRect.top + y / 180 * canvasRect.height
			} ) );
		};
		let staticPointerRenderCount = 0;
		const staticPointer = $.vis.window( {
			"x": 282,
			"y": 142,
			"width": 30,
			"height": 20,
			"onRender": () => {
				staticPointerRenderCount += 1;
			}
		} );
		const staticPointerRecord = testPluginApi.getScreenData(
			"pi-vision-test", staticPointer.id
		).vis.element;
		$.vis.render();
		const pointerStaticRenderCount = staticPointerRenderCount;
		dispatchMouse( "mousedown", 284, 144, 1 );
		dispatchMouse( "mousemove", 290, 150, 1 );
		dispatchMouse( "mouseup", 290, 150, 0 );
		await new Promise( ( resolve ) => requestAnimationFrame( resolve ) );
		check(
			staticPointerRecord.x === 282 && staticPointerRecord.y === 142 &&
				staticPointer.width() === 30 && staticPointer.height() === 20,
			"pointer cannot manage static window"
		);
		check(
			staticPointerRenderCount === pointerStaticRenderCount,
			"static pointer input does not render"
		);
		staticPointer.close();
		dispatchMouse( "mousedown", 16, 20, 1 );
		const pointerDownRenderCount = borderedRenderCount;
		dispatchMouse( "mousemove", 18, 20, 1 );
		dispatchMouse( "mousemove", 19, 20, 1 );
		check(
			borderedRenderCount === pointerDownRenderCount,
			"pointer moves defer rendering"
		);
		await new Promise( ( resolve ) => requestAnimationFrame( resolve ) );
		check(
			borderedRenderCount === pointerDownRenderCount + 1,
			"pointer moves coalesce rendering"
		);
		dispatchMouse( "mouseup", 19, 20, 0 );

		const programmaticMoveCount = borderedRenderCount;
		bordered.move( 12, 16 );
		check(
			borderedRenderCount === programmaticMoveCount + 1,
			"programmatic move renders synchronously"
		);
		const programmaticResizeCount = borderedRenderCount;
		bordered.resize( 126, 88 );
		check(
			borderedRenderCount === programmaticResizeCount + 1,
			"programmatic resize renders synchronously"
		);
		bordered.resize( 120, 80 );
		$.vis.render();

		if( failures.length === 0 ) {
			$.setColor( 2 );
			$.setPosPx( 4, 168 );
			$.print( "Pi Vision Phase 2: PASS" );
		} else {
			$.setColor( 4 );
			$.setPosPx( 4, 168 );
			$.print( "Pi Vision Phase 2: FAIL" );
		}

		for( const failure of failures ) {
			$.print( failure );
		}

		function check( condition, name ) {
			if( !condition ) {
				failures.push( name );
			}
		}

		function drawBordered( screen ) {
			borderedRenderCount += 1;
			screen.setColor( 1 );
			screen.rect( 0, 0, screen.width(), screen.height(), 1 );
			screen.setColor( 14 );
			screen.line( 2, 2, screen.width() - 3, screen.height() - 3 );
			screen.setPos( 1, 1 );
			screen.print( "Pi.js" );
		}

		function checkThrows( fn, name, errorCode = null ) {
			let thrownError = null;
			try {
				fn();
			} catch( error ) {
				thrownError = error;
			}
			check(
				thrownError !== null &&
					( errorCode === null || thrownError.code === errorCode ),
				name
			);
		}
	} );
</script>
</body>
</html>
