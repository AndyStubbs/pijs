<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Pi.js Animated Shader Demo 02</title>
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			background: #000005;
			overflow: hidden;
		}

		#screen {
			width: 100%;
			height: 100%;
		}
	</style>
</head>
<body>
	<script id="hue-shader" style="display: none" type="x-shader/x-fragment">
		#version 300 es
		precision mediump float;

		in vec2 v_texCoord;

		uniform sampler2D u_texture;
		uniform float u_time;

		out vec4 fragColor;

		vec3 hsv2rgb( vec3 c ) {
			vec4 K = vec4( 1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0 );
			vec3 p = abs( fract( c.xxx + K.xyz ) * 6.0 - K.www );
			return c.z * mix( K.xxx, clamp( p - K.xxx, 0.0, 1.0 ), c.y );
		}

		void main() {
			vec4 color = texture( u_texture, v_texCoord );

			float lum = dot( color.rgb, vec3( 0.299, 0.587, 0.114 ) );

			float hue = fract( u_time * 0.15 );

			vec3 shifted = hsv2rgb( vec3( hue, 0.85, lum ) );

			fragColor = vec4( mix( color.rgb, shifted, 0.9 ), color.a );
		}
	</script>
	<script id="swirl-shader" style="display: none" type="x-shader/x-fragment">
		#version 300 es
		precision mediump float;

		in vec2 v_texCoord;

		uniform sampler2D u_texture;
		uniform float u_time;
		uniform float u_strength;

		out vec4 fragColor;

		void main() {
			vec2 center = vec2( 0.5 );
			vec2 delta = v_texCoord - center;

			float distanceFromCenter = length( delta );

			float angle =
				u_strength *
				exp( -distanceFromCenter * 3.5 ) *
				sin( u_time * 1.5 );

			float s = sin( angle );
			float c = cos( angle );

			mat2 rotation = mat2( c, -s, s, c );

			vec2 uv = center + rotation * delta;

			if(
				uv.x < 0.0 ||
				uv.x > 1.0 ||
				uv.y < 0.0 ||
				uv.y > 1.0
			) {
				fragColor = vec4( 0.0, 0.0, 0.0, 1.0 );
				return;
			}

			fragColor = texture( u_texture, uv );
		}
	</script>
	<script id="zoom-shader" style="display: none" type="x-shader/x-fragment">
		#version 300 es
		precision mediump float;

		in vec2 v_texCoord;

		uniform sampler2D u_texture;
		uniform float u_time;
		uniform vec2 u_sourceSize;

		out vec4 fragColor;

		void main() {
			float phase = fract( u_time * 0.35 );
			float zoom = 1.0 - phase * 0.08;

			vec2 uv = ( v_texCoord - 0.5 ) * zoom + 0.5;

			if(
				uv.x < 0.0 ||
				uv.x > 1.0 ||
				uv.y < 0.0 ||
				uv.y > 1.0
			) {
				fragColor = vec4( 0.0, 0.0, 0.0, 1.0 );
				return;
			}

			// Sample previous frame position for a motion trail feel.
			vec4 current = texture( u_texture, uv );

			vec2 pixel = 1.0 / u_sourceSize;
			vec4 trail = texture(
				u_texture,
				( v_texCoord - 0.5 ) * ( zoom + 0.03 ) + 0.5
			);

			vec3 color = max( current.rgb, trail.rgb * 0.92 );

			float edgeFade = smoothstep( 0.0, 0.06, phase );
			color *= 0.7 + 0.3 * edgeFade;

			fragColor = vec4( color, current.a );
		}
	</script>
	<script id="water-shader" style="display: none" type="x-shader/x-fragment">
		#version 300 es
		precision mediump float;

		in vec2 v_texCoord;

		uniform sampler2D u_texture;
		uniform float u_time;

		out vec4 fragColor;

		void main() {
			vec2 uv = v_texCoord;

			uv.x += sin( uv.y * 20.0 + u_time * 2.2 ) * 0.008;
			uv.y += cos( uv.x * 16.0 - u_time * 1.6 ) * 0.006;

			vec4 color = texture( u_texture, uv );

			float shimmer =
				0.94 +
				0.06 * sin(
					v_texCoord.y * 90.0 +
					u_time * 4.0
				);
			color.rgb *= shimmer;

			fragColor = color;
		}
	</script>
	<script id="bloom-shader" style="display: none" type="x-shader/x-fragment">
		#version 300 es
		precision mediump float;

		in vec2 v_texCoord;

		uniform sampler2D u_texture;
		uniform vec2 u_sourceSize;
		uniform float u_time;

		out vec4 fragColor;

		void main() {
			vec4 source = texture( u_texture, v_texCoord );

			vec2 pixel = 1.0 / u_sourceSize;
			vec3 glow = vec3( 0.0 );

			for( int ring = 1; ring <= 4; ring++ ) {
				float radius = float( ring ) * 2.5;
				float weight = 1.0 / float( ring );

				glow += texture(
					u_texture,
					v_texCoord + vec2( pixel.x * radius, 0.0 )
				).rgb * weight;

				glow += texture(
					u_texture,
					v_texCoord - vec2( pixel.x * radius, 0.0 )
				).rgb * weight;

				glow += texture(
					u_texture,
					v_texCoord + vec2( 0.0, pixel.y * radius )
				).rgb * weight;

				glow += texture(
					u_texture,
					v_texCoord - vec2( 0.0, pixel.y * radius )
				).rgb * weight;
			}

			glow /= 16.0;

			float brightness = max(
				max( source.r, source.g ),
				source.b
			);
			float amount = smoothstep( 0.55, 1.0, brightness );

			float pulse = 0.85 +
				0.15 * sin( u_time * 2.5 );

			vec3 color = source.rgb +
				glow * amount * 1.6 * pulse;

			fragColor = vec4( color, source.a );
		}
	</script>

	<script src="../../build/pi.js"></script>
	<script>
		// Generated by OX Alpha
		$.ready( function() {
			$.screen( "320x180" );

			const hueShader = $.createShader(
				document.getElementById( "hue-shader" ).textContent.trim()
			);
			const swirlShader = $.createShader(
				document.getElementById( "swirl-shader" ).textContent.trim()
			);
			const zoomShader = $.createShader(
				document.getElementById( "zoom-shader" ).textContent.trim()
			);
			const waterShader = $.createShader(
				document.getElementById( "water-shader" ).textContent.trim()
			);
			const bloomShader = $.createShader(
				document.getElementById( "bloom-shader" ).textContent.trim()
			);

			const shaders = [
				{
					"handle": null,
					"name": "None",
					"description": "No display shader standard renderer"
				},
				{
					"handle": hueShader,
					"name": "HUE CYCLE",
					"description": "Luminance-driven hue rotation over time"
				},
				{
					"handle": swirlShader,
					"name": "SWIRL",
					"description": "Rotational vortex distortion from center"
				},
				{
					"handle": zoomShader,
					"name": "ZOOM PULSE",
					"description": "Rhythmic zoom punch with motion trails"
				},
				{
					"handle": waterShader,
					"name": "WATER",
					"description": "Gentle multi-axis refraction shimmer"
				},
				{
					"handle": bloomShader,
					"name": "BLOOM",
					"description": "Bright areas glow and pulse softly"
				}
			];

			const SHADER_DURATION = 5;
			const START_TIME = performance.now();
			const FPS_UPDATE_INTERVAL = 500;

			let gCurrentShaderIndex = -1;
			let gFps = 0;
			let gFpsFrameCount = 0;
			let gFpsUpdateTime = START_TIME;
			let gApplyCometTrail = true;

			function setShader( index ) {
				if( index === gCurrentShaderIndex ) {
					return;
				}
				gApplyCometTrail = Math.random() > 0.5;
				gCurrentShaderIndex = index;
				const shader = shaders[ index ];
				$.setDisplayShader( shader.handle );
			}

			function drawBackground( time ) {
				// Deep space gradient bands
				for( let y = 0; y < 180; y += 4 ) {
					const t = y / 180;
					const r = Math.floor( 4 + t * 14 );
					const g = Math.floor( 2 + t * 6 );
					const b = Math.floor( 18 + t * 40 );
					$.setColor(
						"rgba(" + r + "," + g + "," + b + ",255)"
					);
					$.rect( 0, y, 320, 4 );
				}
			}

			function drawStars( time ) {
				for( let i = 0; i < 60; i++ ) {
					// Deterministic pseudo-random positions per star.
					const sx = ( i * 137.5 ) % 320;
					const baseY = ( i * 61.7 ) % 180;
					const drift = time * ( 2 + ( i % 5 ) ) * 3;
					const y = ( baseY - drift % 180 + 180 ) % 180;
					const twinkle =
						Math.sin( time * 3.0 + i * 1.7 ) * 0.5 + 0.5;
					const bright = 140 + Math.floor( twinkle * 115 );

					$.setColor( "rgba(" +
						bright + "," + bright + ",255,255)"
					);
					$.pset( Math.floor( sx ), Math.floor( y ) );
				}
			}

			function drawPlanet( time ) {
				const x = 240;
				const y = 110 + Math.sin( time * 0.6 ) * 4;
				const radius = 34;

				// Glow halo
				for( let r = radius + 10; r > radius; r -= 2 ) {
					const alpha = ( ( radius + 10 - r ) / 10 ) * 0.25;
					$.setColor( "rgba(80,120,255," + alpha.toFixed( 3 ) + ")" );
					$.circle( x, y, r );
				}

				// Planet body
				$.circle( x, y, radius, "#2050C8" );

				// Latitude bands, clipped to the circle using chord widths.
				const bandHeight = 6;
				for(
					let dy = -radius + bandHeight / 2;
					dy < radius;
					dy += bandHeight
				) {
					const halfWidth = Math.sqrt( radius * radius - dy * dy );
					if( halfWidth <= 1 ) {
						continue;
					}
					const shade =
						Math.sin( dy / radius * Math.PI * 3 + time * 0.4 );
					const bright = shade > 0;

					$.setColor(
						bright ? "#3060E0" : "#1840A8"
					);
					$.rect(
						x - halfWidth,
						y + dy - bandHeight / 2,
						halfWidth * 2,
						bandHeight
					);
				}

				// Subtle spherical shading: darken one limb with clipped chords.
				for( let dy = -radius; dy < radius; dy += 2 ) {
					const halfWidth = Math.sqrt( radius * radius - dy * dy );
					if( halfWidth <= 0 ) {
						continue;
					}
					// Fraction across the disc, 0 at left edge -> 1 at right edge.
					const t = 0.5 + 0.5;
					const startFrac = 0.55 +
						Math.sin( time * 0.2 ) * 0.05;
					const shadowX = x - halfWidth + halfWidth * 2 * startFrac;
					const shadowW = x + halfWidth - shadowX;

					if( shadowW <= 0 ) {
						continue;
					}
					$.setColor( "rgba(0,0,30,0.5)" );
					$.rect( shadowX, y + dy, shadowW, 2 );
				}

				// Rim highlight on the lit side.
				$.setColor( "#70A8FF" );
				$.arc( x, y, radius - 1, 110, 250 );

				// Moon orbiting the planet.
				const moonAngle = time * 1.1;
				const mx = x + Math.cos( moonAngle ) * ( radius + 22 );
				const my = y + Math.sin( moonAngle ) * 10;
				$.setColor( "#C0C0D0" );
				$.circle( mx, my, 5, "#C0C0D0" );
			}
			
			function drawNebula( time ) {
				// Drifting translucent gas clouds.
				$.setBlend( "alpha" );
				for( let i = 0; i < 5; i++ ) {
					const nx =
						( ( i * 83 + time * ( 4 + i * 2 ) ) % 400 ) - 40;
					const ny = 30 + Math.sin( time * 0.5 + i ) * 20;
					const nr = 24 + i * 7;
					const color = i % 2 === 0
						? "rgba(150,40,200,0.10)"
						: "rgba(40,160,220,0.10)";
					$.setColor( color );
					$.circle( nx, ny, nr, $.getColor() );
				}
				$.setBlend( "replace" );
			}

			function drawShipAndComet( time ) {
				// Comet streaking across the sky.
				if( gApplyCometTrail ) {
					const cycle = ( time * 0.4 ) % 1.4;
					const cx = cycle * 380 - 30;
					const cy = 30 + cx * 0.25;

					for( let t = 0; t < 14; t++ ) {
						const fade = 1.0 - t / 14;
						$.setColor(
							"rgba(255,230,120," +
							( fade * 0.8 ).toFixed( 3 ) + ")"
						);
						$.pset( Math.floor( cx - t * 3 ), Math.floor( cy - t ) );
					}
					$.setColor( "#FFFFFF" );
					$.pset( Math.floor( cx ), Math.floor( cy ) );
				}

				// Small exploration ship drifting along the bottom.
				const x = 160 + Math.sin( time * 0.9 ) * 100;
				const y = 155 + Math.cos( time * 1.6 ) * 5;

				// Engine exhaust flicker
				$.setColor(
					Math.sin( time * 30 ) > 0 ? "#FF8020" : "#FFD040"
				);
				$.line( x - 4, y + 3, x - 9, y + 3 );

				$.setColor( "#E0E0FF" );
				$.line( x - 4, y + 3, x, y - 4 );
				$.line( x, y - 4, x + 6, y + 3 );
				$.setColor( "#8090FF" );
				$.line( x - 4, y + 3, x + 6, y + 3 );
			}

			function drawShaderInfo( shader ) {
				// Draw a dark panel so the text remains readable.
				$.setBlend( "alpha" );
				$.rect( 4, 4, 312, 31, "#000000CC" );
				$.setBlend( "replace" );
				$.setColor( "#FFFFFF" );
				$.setPosPx( 9, 8 );
				$.print( "DISPLAY SHADER: " + shader.name );
				$.setPosPx( 200, 8 );
				$.print( "COMET: " + gApplyCometTrail );
				$.setColor( "#80FFA0" );
				$.setPosPx( 9, 20 );
				$.print( shader.description );
			}

			function updateFps( now ) {
				gFpsFrameCount += 1;
				const elapsed = now - gFpsUpdateTime;

				if( elapsed >= FPS_UPDATE_INTERVAL ) {
					gFps = Math.round( ( gFpsFrameCount * 1000 ) / elapsed );
					gFpsFrameCount = 0;
					gFpsUpdateTime = now;
				}
			}

			function drawFps() {
				const label = "FPS: " + gFps;
				const charWidth = 6;
				const charHeight = 8;
				const padding = 3;
				const textWidth = label.length * charWidth;
				const panelWidth = textWidth + padding * 2;
				const panelHeight = charHeight + padding * 2;
				const panelX = 320 - 4 - panelWidth;
				const panelY = 180 - 8 - panelHeight;

				$.setBlend( "alpha" );
				$.rect( panelX, panelY, panelWidth, panelHeight, "#000000CC" );
				$.setBlend( "replace" );
				$.setColor( "#80FFA0" );
				$.setPosPx( panelX + padding, panelY + padding );
				$.print( label );
			}

			function drawShaderTimer( elapsed, shaderIndex ) {
				const shaderTime = elapsed - shaderIndex * SHADER_DURATION;
				const progress = shaderTime / SHADER_DURATION;
				const width = Math.floor( 312 * Math.min( progress, 1 ) );
				$.rect( 4, 174, 312, 2, "#103020" );

				if( width > 0 ) {
					$.rect( 4, 174, width, 2, "#80FFA0" );
				}
			}

			function frame( now ) {
				updateFps( now );
				const elapsed = ( now - START_TIME ) / 1000;
				const totalDuration = shaders.length * SHADER_DURATION;
				const cycleTime = elapsed % totalDuration;
				let shaderIndex = Math.floor( cycleTime / SHADER_DURATION );

				if( shaderIndex < 0 ) {
					shaderIndex = 0;
				}
				setShader( shaderIndex );

				const shader = shaders[ shaderIndex ];
				$.cls();

				drawBackground( elapsed );
				drawStars( elapsed );
				drawNebula( elapsed );
				drawPlanet( elapsed );

				if( gApplyCometTrail ) {
					// Reserved for an optional FBO pass if needed later.
				}

				drawShipAndComet( elapsed );
				drawShaderInfo( shader );
				drawShaderTimer( cycleTime, shaderIndex );
				drawFps();
				requestAnimationFrame( frame );
			}

			requestAnimationFrame( frame );
		} );
	</script>
</body>
</html>
