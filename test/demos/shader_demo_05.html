<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Pi.js Animated Shader Demo 05</title>
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			background: #000208;
			overflow: hidden;
		}

		#screen {
			width: 100%;
			height: 100%;
		}
	</style>
</head>
<body>
	<script id="shimmer-shader" style="display: none" type="x-shader/x-fragment">
		#version 300 es
		precision mediump float;

		in vec2 v_texCoord;

		uniform sampler2D u_texture;
		uniform float u_time;
		uniform float u_strength;

		out vec4 fragColor;

		void main() {
			vec2 uv = v_texCoord;

			float heat1 = sin(uv.x * 40.0 + u_time * 4.0);
			float heat2 = cos(uv.x * 17.0 - u_time * 2.3);

			uv.y += (heat1 + heat2 * 0.5) * u_strength;

			fragColor = texture(u_texture, uv);
		}
	</script>
	<script id="swirl-shader" style="display: none" type="x-shader/x-fragment">
		#version 300 es
		precision mediump float;

		in vec2 v_texCoord;

		uniform sampler2D u_texture;
		uniform float u_time;

		out vec4 fragColor;

		void main() {
			vec2 center = vec2(0.5);
			vec2 delta = v_texCoord - center;
			float dist = length(delta);

			float angle = atan(delta.y, delta.x);
			angle += sin(u_time * 0.8) * 2.5 * (1.0 - dist);

			vec2 uv = center + dist * vec2(cos(angle), sin(angle));

			fragColor = texture(u_texture, uv);
		}
	</script>
	<script id="kaleido-shader" style="display: none" type="x-shader/x-fragment">
		#version 300 es
		precision mediump float;

		in vec2 v_texCoord;

		uniform sampler2D u_texture;
		uniform float u_time;

		out vec4 fragColor;

		void main() {
			vec2 center = vec2(0.5);
			vec2 delta = v_texCoord - center;

			float angle = atan(delta.y, delta.x);
			float dist = length(delta);

			float segments = 6.0;
			float slice = 6.2831853 / segments;

			angle = mod(angle, slice);
			angle = abs(angle - slice * 0.5);
			angle += u_time * 0.3;

			vec2 uv = center + dist * vec2(cos(angle), sin(angle));

			fragColor = texture(u_texture, uv);
		}
	</script>
	<script id="posterize-shader" style="display: none" type="x-shader/x-fragment">
		#version 300 es
		precision mediump float;

		in vec2 v_texCoord;

		uniform sampler2D u_texture;
		uniform float u_time;

		out vec4 fragColor;

		void main() {
			vec4 color = texture(u_texture, v_texCoord);

			float levels = 2.0 + floor(
				3.0 * (0.5 + 0.5 * sin(u_time * 1.2))
			);

			color.rgb = floor(color.rgb * levels) / levels;

			// Slight color rotation for extra style
			float shift = sin(u_time * 0.9) * 0.5 + 0.5;
			color.rgb = mix(color.rgb, color.brg, shift * 0.35);

			fragColor = color;
		}
	</script>
	<script id="mirror-shader" style="display: none" type="x-shader/x-fragment">
		#version 300 es
		precision mediump float;

		in vec2 v_texCoord;

		uniform sampler2D u_texture;
		uniform float u_time;

		out vec4 fragColor;

		void main() {
			vec2 uv = v_texCoord;

			float splitX = 0.5 + sin(u_time * 0.6) * 0.2;

			if( uv.x > splitX ) {
				uv.x = splitX - (uv.x - splitX);
			}

			vec4 color = texture(u_texture, uv);

			// Tint the mirrored side slightly
			if( v_texCoord.x > splitX ) {
				color.rgb *= vec3(0.8, 0.9, 1.2);
			}

			fragColor = color;
		}
	</script>
	<script id="zoom-shader" style="display: none" type="x-shader/x-fragment">
		#version 300 es
		precision mediump float;

		in vec2 v_texCoord;

		uniform sampler2D u_texture;
		uniform vec2 u_sourceSize;
		uniform float u_time;

		out vec4 fragColor;

		void main() {
			vec2 center = vec2(0.5);
			float zoom = 1.0 + 0.15 * sin(u_time * 2.5);

			vec2 uv = center + (v_texCoord - center) / zoom;

			vec2 pixel = 1.0 / u_sourceSize;
			float dist = length(v_texCoord - center);
			float blur = dist * 6.0;

			float red = texture(
				u_texture,
				uv + vec2(pixel.x * blur, 0.0)
			).r;
			float green = texture(u_texture, uv).g;
			float blue = texture(
				u_texture,
				uv - vec2(pixel.x * blur, 0.0)
			).b;

			fragColor = vec4(red, green, blue, 1.0);
		}
	</script>

	<script src="../../build/pi.js"></script>
	<script>
		// Generated by Kimi K3
		$.ready( function() {
			$.screen( "320x180" );

			const shimmerShader = $.createShader(
				document.getElementById( "shimmer-shader" ).textContent.trim()
			);
			const swirlShader = $.createShader(
				document.getElementById( "swirl-shader" ).textContent.trim()
			);
			const kaleidoShader = $.createShader(
				document.getElementById( "kaleido-shader" ).textContent.trim()
			);
			const posterizeShader = $.createShader(
				document.getElementById( "posterize-shader" ).textContent.trim()
			);
			const mirrorShader = $.createShader(
				document.getElementById( "mirror-shader" ).textContent.trim()
			);
			const zoomShader = $.createShader(
				document.getElementById( "zoom-shader" ).textContent.trim()
			);

			const shaders = [
				{
					"handle": null,
					"name": "None",
					"description": "No display shader standard renderer"
				},
				{
					"handle": swirlShader,
					"name": "SWIRL",
					"description": "The whole scene twists around the center"
				},
				{
					"handle": kaleidoShader,
					"name": "KALEIDOSCOPE",
					"description": "Six-fold mirrored symmetry, slowly rotating"
				},
				{
					"handle": posterizeShader,
					"name": "POSTERIZE",
					"description": "Color levels pulse and channels rotate"
				},
				{
					"handle": mirrorShader,
					"name": "MIRROR",
					"description": "A sliding split mirrors the scene"
				},
				{
					"handle": zoomShader,
					"name": "ZOOM PULSE",
					"description": "Breathing zoom with radial RGB blur"
				}
			];

			const SHADER_DURATION = 5;
			const START_TIME = performance.now();
			const FPS_UPDATE_INTERVAL = 500;

			let gCurrentShaderIndex = -1;
			let gFps = 0;
			let gFpsFrameCount = 0;
			let gFpsUpdateTime = START_TIME;
			let gApplyShimmerShader = true;

			// Pre-generate starfield
			const stars = [];
			for( let i = 0; i < 60; i++ ) {
				stars.push( {
					"angle": Math.random() * Math.PI * 2,
					"speed": 20 + Math.random() * 40,
					"offset": Math.random() * 200,
					"color": [ "#FFFFFF", "#80FFFF", "#FF80FF" ][ i % 3 ]
				} );
			}

			function setShader( index ) {
				if( index === gCurrentShaderIndex ) {
					return;
				}
				gApplyShimmerShader = Math.random() > 0.5;
				gCurrentShaderIndex = index;
				const shader = shaders[ index ];
				$.setDisplayShader( shader.handle );
			}

			function drawStarTunnel( time ) {
				$.setColor( "#000208" );
				$.rect( 0, 0, 320, 180, "#000208" );

				const cx = 160;
				const cy = 90;

				// Concentric tunnel rings
				for( let i = 0; i < 8; i++ ) {
					const phase = ( time * 30 + i * 25 ) % 200;
					const r = phase;
					const brightness = 1 - phase / 200;
					const g = Math.floor( brightness * 120 );
					const b = Math.floor( brightness * 255 );
					$.setColor( "rgb(0," + g + "," + b + ")" );
					$.circle( cx, cy, r );
				}

				// Stars flying outward
				for( let i = 0; i < stars.length; i++ ) {
					const star = stars[ i ];
					const dist = ( time * star.speed + star.offset ) % 200;
					const x = cx + Math.cos( star.angle ) * dist;
					const y = cy + Math.sin( star.angle ) * dist * 0.6;

					if( x >= 0 && x < 320 && y >= 0 && y < 180 ) {
						$.setColor( star.color );
						const size = dist > 120 ? 2 : 1;
						$.rect( x, y, size, size, star.color );
					}
				}
			}

			function drawBouncingLogo( time ) {
				const x = 160 + Math.sin( time * 1.1 ) * 110;
				const y = 90 + Math.cos( time * 1.7 ) * 55;

				// Diamond shape
				$.setColor( "#FFDD00" );
				$.line( x, y - 10, x + 10, y );
				$.line( x + 10, y, x, y + 10 );
				$.line( x, y + 10, x - 10, y );
				$.line( x - 10, y, x, y - 10 );

				$.setColor( "#FF8800" );
				$.line( x, y - 5, x + 5, y );
				$.line( x + 5, y, x, y + 5 );
				$.line( x, y + 5, x - 5, y );
				$.line( x - 5, y, x, y - 5 );
			}

			function drawOrbiters( time ) {
				for( let i = 0; i < 6; i++ ) {
					const angle = time * 1.5 + ( i / 6 ) * Math.PI * 2;
					const x = 160 + Math.cos( angle ) * 60;
					const y = 90 + Math.sin( angle ) * 35;

					const color = i % 2 === 0 ? "#FF4060" : "#40FF80";
					$.setColor( color );
					$.circle( x, y, 4, color );
				}
			}

			function drawShaderInfo( shader ) {

				// Draw a dark panel so the text remains readable.
				$.setBlend( "alpha" );
				$.rect( 4, 4, 312, 31, "#000000CC" );
				$.setBlend( "replace" );
				$.setColor( "#FFFFFF" );
				$.setPosPx( 9, 8 );
				$.print( "DISPLAY SHADER: " + shader.name );
				$.setPosPx( 200, 8 );
				$.print( "SHIMMER: " + gApplyShimmerShader );
				$.setColor( "#FFDD00" );
				$.setPosPx( 9, 20 );
				$.print( shader.description );
			}

			function updateFps( now ) {
				gFpsFrameCount += 1;
				const elapsed = now - gFpsUpdateTime;

				if( elapsed >= FPS_UPDATE_INTERVAL ) {
					gFps = Math.round( ( gFpsFrameCount * 1000 ) / elapsed );
					gFpsFrameCount = 0;
					gFpsUpdateTime = now;
				}
			}

			function drawFps() {
				const label = "FPS: " + gFps;
				const charWidth = 6;
				const charHeight = 8;
				const padding = 3;
				const textWidth = label.length * charWidth;
				const panelWidth = textWidth + padding * 2;
				const panelHeight = charHeight + padding * 2;
				const panelX = 320 - 4 - panelWidth;
				const panelY = 180 - 8 - panelHeight;

				$.setBlend( "alpha" );
				$.rect( panelX, panelY, panelWidth, panelHeight, "#000000CC" );
				$.setBlend( "replace" );
				$.setColor( "#FFDD00" );
				$.setPosPx( panelX + padding, panelY + padding );
				$.print( label );
			}

			function drawShaderTimer( elapsed, shaderIndex ) {
				const shaderTime = elapsed - shaderIndex * SHADER_DURATION;
				const progress = shaderTime / SHADER_DURATION;
				const width = Math.floor( 312 * Math.min( progress, 1 ) );
				$.rect( 4, 174, 312, 2, "#202040" );

				if( width > 0 ) {
					$.rect( 4, 174, width, 2, "#FFDD00" );
				}
			}

			function frame( now ) {
				updateFps( now );
				const elapsed = ( now - START_TIME ) / 1000;
				const totalDuration = shaders.length * SHADER_DURATION;
				const cycleTime = elapsed % totalDuration;
				let shaderIndex = Math.floor( cycleTime / SHADER_DURATION );

				if( shaderIndex < 0 ) {
					shaderIndex = 0;
				}
				setShader( shaderIndex );

				const shader = shaders[ shaderIndex ];
				$.cls();

				drawStarTunnel( elapsed );

				if( gApplyShimmerShader ) {
					const shimmerStrength =
						0.004 + Math.sin( elapsed * 2.1 ) * 0.002;
					$.applyShader( shimmerShader, {
						"u_strength": shimmerStrength
					} );
				}

				drawOrbiters( elapsed );
				drawBouncingLogo( elapsed );
				drawShaderInfo( shader );
				drawShaderTimer( cycleTime, shaderIndex );
				drawFps();
				requestAnimationFrame( frame );
			}

			requestAnimationFrame( frame );
		} );
	</script>
</body>
</html>
