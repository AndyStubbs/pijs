title = "filterImg"
category = "pixels"
isScreen = true
summary = "Applies a filter function to a rectangular region of the screen."
description = """
Defers a CPU filter until after the current synchronous work. The callback receives a reusable
pixel buffer (RGBA as Uint8ClampedArray) and view-local x, y coordinates. Return truthy to keep
the modified pixel, or falsy to make it transparent. Copy the buffer to retain a pixel beyond
its callback.

The region and view coordinates are captured when called. Pixel data is read when the queued
filter runs. Removing the screen cancels queued filtering without invoking the callback. If a
callback removes its own screen, filtering stops immediately, with no further callbacks or
pixel upload. This command returns no promise; callback exceptions retain their normal behavior.
Drawing performed synchronously after the call is included when the filter reads the framebuffer.
Continue on a later task or animation frame to capture the result or draw above it.

Filtering runs on the CPU rather than the GPU, so large areas may not be suitable for use in
an animationFrame.
"""
example = """
$.screen( "300x200" );
$.circle( 150, 100, 50, "red" );
$.filterImg( function ( color, x, y ) {
	color[ 0 ] = color[ 0 ] - Math.round( Math.tan( ( x + y ) / 10 ) * 128 );
	color[ 1 ] = color[ 1 ] + Math.round( Math.cos( x / 7 ) * 128 );
	color[ 2 ] = color[ 2 ] + Math.round( Math.sin( y / 5 ) * 128 );
	return color;
} );
"""

[[parameters]]
name = "filter"
type = "function"
signature = "( color: Uint8ClampedArray, x: number, y: number ) => boolean"
description = "Callback (color, x, y): color holds RGBA at indices 0-3. Return truthy to keep the modified pixel, or falsy to make it transparent. Copy the buffer to retain it."

[[parameters]]
name = "x1"
type = "number"
description = "Left coordinate (default 0)."
optional = true

[[parameters]]
name = "y1"
type = "number"
description = "Top coordinate (default 0)."
optional = true

[[parameters]]
name = "x2"
type = "number"
description = "Right coordinate (default screen width - 1)."
optional = true

[[parameters]]
name = "y2"
type = "number"
description = "Bottom coordinate (default screen height - 1)."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
