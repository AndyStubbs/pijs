title = "getPixelAsync"
category = "pixels"
isScreen = true
summary = "Asynchronously reads the color of a single pixel."
description = """
Reads the color at (x, y) asynchronously. If asIndex is true, resolves to the palette index;
otherwise resolves to a color value object.

Coordinates use the view captured when called; pixel data is read in a deferred microtask.
If the screen is removed before deferred processing completes, the promise rejects with an
Error whose code is "SCREEN_REMOVED". Other read failures reject with the original error.
An out-of-bounds result completed immediately is unaffected by later screen removal.
Invalid arguments still throw synchronously.
"""
example = """
$.screen( "300x200" );
$.circle( 150, 100, 50, "blue" );
getCircleFillColor();

async function getCircleFillColor() {
	const color = await $.getPixelAsync( 150, 100 );
	$.print( `Circle fill color: [${color.array.join( ", " )}]` );
	const idx = await $.getPixelAsync( 150, 100, true );
	$.print( `Circle fill color index: ${idx}` );
}
"""

[[parameters]]
name = "x"
type = "number"
description = "X (horizontal) coordinate."

[[parameters]]
name = "y"
type = "number"
description = "Y (vertical) coordinate."

[[parameters]]
name = "asIndex"
type = "boolean"
description = "If true, resolve to palette index instead of color value."
optional = true

[[returns]]
type = "Promise<number | object>"
typeDesc = "*Promise"
description = """
Resolves to a palette index or color value object. Rejects with code SCREEN_REMOVED if the
screen is removed before deferred processing completes, or with the original read error.
"""
