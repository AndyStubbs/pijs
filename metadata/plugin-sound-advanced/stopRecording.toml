title = "stopRecording"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Stops recording and returns the recording as a WAV file."
description = """
Stops the recording from startRecording() and resolves with a WAV file. The file is stereo, as 16-bit or 32-bit samples. Pass it to saveRecording() to download it.

Stopping while the recording is still starting waits for it to start.
"""
example = """
$.screen( "300x200" );
$.print( "Press R to record, S to stop and save" );
$.onKey( "r", "down", async () => {
	await $.startRecording( "sfx" );
	$.print( "Recording sound effects" );
}, true );
$.onKey( "s", "down", async () => {
	const wav = await $.stopRecording();
	$.saveRecording( wav, "effects.wav" );
}, true );
$.onKey( "Space", "down", () => {
	$.sound( 440 + Math.random() * 440, 0.2 );
} );
"""
parameters = [ ]

[[returns]]
type = "Promise<Blob>"
typeDesc = "Promise"
description = "Resolves with the recording as an audio/wav Blob."
