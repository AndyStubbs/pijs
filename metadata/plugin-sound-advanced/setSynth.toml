title = "setSynth"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Changes the volume, pitch, or filter cutoff of a held sound while it plays."
description = """
Changes a sound started with synth() or sfx() and hold set to true. Omitted values stay as they are.

volume replaces the sound's volume. detune shifts the pitch in cents from the sound's frequency, where 100 cents is a semitone. filterCutoff replaces the filter's cutoff, and does nothing when the sound has no filter.

Sounds that are not held, or that have finished, are ignored. A released sound can still be changed until it ends.
"""
example = """
$.screen( "300x200" );
$.print( "Hold the mouse button, then move up and down" );
let tone = null;
$.onMouse( "down", () => {
	tone = $.synth( { "frequency": 110, "volume": 0.4, "oType": "sawtooth", "hold": true } );
} );
$.onMouse( "move", ( mouse ) => {
	if( tone ) {
		$.setSynth( { "soundId": tone, "detune": ( 100 - mouse.y ) * 12 } );
	}
} );
$.onMouse( "up", () => {
	$.releaseSound( tone );
	tone = null;
} );
"""

[[parameters]]
name = "soundId"
type = "string"
description = "Sound ID of a held sound."

[[parameters]]
name = "volume"
type = "number"
description = "New volume, 0-1."
optional = true

[[parameters]]
name = "detune"
type = "number"
description = "Pitch offset in cents from the sound's frequency, -4800 to 4800."
optional = true

[[parameters]]
name = "filterCutoff"
type = "number"
description = "New filter cutoff in Hz, above 0 and at most 24000."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
