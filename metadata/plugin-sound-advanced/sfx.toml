title = "sfx"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Plays a named sound-effect preset."
description = """
Plays a named preset of synth() options. The built-in presets are "coin", "laser", "jump", "hit", "explosion", "powerup", "blip", and "select". definePreset() adds presets or replaces these.

variation randomly changes the pitch and length so repeated effects do not sound identical. At 1, the pitch moves by up to 3 semitones and the duration by up to 10%.
"""
example = """
$.screen( "300x200" );
$.print( "Press C for a coin, J to jump, or L for a laser" );
$.onKey( "KeyC", "down", () => {
	$.sfx( "coin" );
} );
$.onKey( "KeyJ", "down", () => {
	$.sfx( "jump", 0.3 );
} );
$.onKey( "KeyL", "down", () => {
	$.sfx( "laser", 0.5 );
} );
"""

[[parameters]]
name = "name"
type = "string"
description = "Preset name."

[[parameters]]
name = "variation"
type = "number"
description = "Random pitch and duration variation, 0-1 (default: 0)."
optional = true

[[returns]]
type = "string"
description = "Sound ID for use with stopSound()."
