title = "onPlay"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Registers a handler for PLAY notes or song ends, called when the music is heard."
description = """
Registers a callback for music started with play(). "note" runs for each note as it starts to sound. "end" runs once when a song finishes or stopPlay() stops it.

A note's data has type, trackId, track, time, duration, frequency, volume, and delay. trackId is the ID play() returned, and track is the index of the comma-separated track. duration runs to the end of the release, and volume is the peak volume. An end's data has type, trackId, stopped, and delay. stopped is true after stopPlay().

once removes the callback before its first run. Callbacks run when the note is heard. Notes that would arrive late, such as while the tab is hidden, are skipped. Song ends are always delivered.
"""
example = """
$.screen( "300x200" );
$.print( "Press any key to play" );
$.onPlay( "note", ( note ) => {
	$.setColor( 1 + note.track * 3 );
	$.circle( Math.log2( note.frequency / 110 ) * 60, 100 + note.track * 40, 6, 1 );
} );
$.onPlay( "end", () => {
	$.print( "Song over" );
} );
$.onKey( "any", "down", () => {
	$.cls();
	$.play( "T120 O4 L8 C E G O5 C O4 G E C4, T120 O2 L2 C G" );
}, true );
"""

[[parameters]]
name = "mode"
type = "\"note\" | \"end\""
typeDesc = "string"
description = "\"note\" for each note as it sounds, or \"end\" when a song finishes or is stopped."

[[parameters]]
name = "fn"
type = "function"
signature = "( data: { type: \"note\"; trackId: number; track: number; time: number; duration: number; frequency: number; volume: number; delay: number } | { type: \"end\"; trackId: number; stopped: boolean; delay: number } ) => void"
description = "Handler called with the event's frozen data."

[[parameters]]
name = "once"
type = "boolean"
description = "Remove the handler after its first call (default: false)."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
