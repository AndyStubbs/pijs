title = "releaseSound"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Releases a held sound, or every held sound, so it fades out over its release time."
description = """
Starts the release of a sound started with synth() or sfx() and hold set to true. The volume fades over releaseTime from the level it has reached. Pass a sound ID to release one sound, or nothing to release every held sound.

A held sound that has not started yet is cancelled. stopSound() ends a held sound immediately, without its release.
"""
example = """
$.screen( "300x200" );
$.print( "Hold the space bar to fire the engine" );
let engine = null;
$.onKey( "Space", "down", () => {
	engine = $.synth( {
		"oType": "pink",
		"volume": 0.6,
		"attackTime": 0.8,
		"releaseTime": 1.2,
		"filterType": "lowpass",
		"filterCutoff": 300,
		"filterAmount": 2,
		"filterAttackTime": 0.8,
		"filterReleaseTime": 1.2,
		"hold": true
	} );
} );
$.onKey( "Space", "up", () => {
	$.releaseSound( engine );
} );
"""

[[parameters]]
name = "soundId"
type = "string"
description = "Sound ID of a held sound. If null, releases every held sound."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
