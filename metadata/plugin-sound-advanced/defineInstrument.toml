title = "defineInstrument"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Defines a play() instrument that a play string selects with @n."
description = """
Stores synth() options as instrument n, from 1 to 255. In a play() string, @n selects it for the notes that follow, and @0 returns to the default sound. A track after a comma keeps the instrument of the track before it.

An instrument replaces only the options it sets. Envelope times are in seconds and replace that stage of the note; stages left out keep the play() envelope. volume scales each note, and pan replaces its position. frequency fixes every note's pitch, and frequencyEnd sweeps each note to that pitch.

A sample instrument plays an audio file instead of a waveform. audio is a name from loadAudio(). rootFrequency is the pitch at which the file plays at its own speed, and each note changes the playback rate, so pitch and length change together. loop repeats the file until the note's release ends; otherwise the note ends when the file does, if that is sooner.

play() reads the instrument when it is called, so a change affects later songs only. params of null removes the instrument. Wait with ready() before playing a sample instrument.

Built-in instruments: 1 square lead, 2 pluck bass, 3 pad, 4 noise snare, 5 hi-hat, and 6 kick drum.
"""
example = """
$.defineInstrument( 7, {
	"oType": "pulse",
	"duty": 0.125,
	"attackTime": 0.005,
	"decayTime": 0.2,
	"sustainLevel": 0.4,
	"vibratoRate": 6,
	"vibratoDepth": 20
} );
$.screen( "300x200" );
$.print( "Press any key to play" );
$.loadAudio( "piano-c4.ogg", "piano" );
$.defineInstrument( 8, { "audio": "piano", "releaseTime": 0.3 } );
$.onKey( "any", "down", () => {
	$.play( "@7 T140 O4 L8 C E G O5 C4, @2 O2 L4 C G, @6 L4 C C" );
	$.play( "@8 T140 O3 L4 C G O4 C O3 G" );
} );
"""

[[parameters]]
name = "instrument"
type = "number"
description = "Instrument number, 1-255."

[[parameters]]
name = "params"
type = "object | null"
description = "synth() options, plus audio, rootFrequency, and loop for a sample instrument, or null to remove the instrument."
