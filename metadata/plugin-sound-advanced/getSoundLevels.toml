title = "getSoundLevels"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Measures the current level of a sound bus, with optional spectrum and waveform data."
description = """
Measures the current level of a bus after its effect and volume. "master" is after the master volume, and "output" is what the speakers receive.

peak is the loudest sample and rms is the average level. With spectrum, the result includes frequency bands in decibels. With waveform, it includes the recent samples. Arrays that were not requested are null.

The first call on a bus returns silence. Call it every frame after that.
"""
example = """
$.screen( "300x200" );
$.print( "Press any key to play" );
$.onKey( "any", "down", () => {
	$.play( "T120 L8 O4 C E G O5 C O4 G E C" );
} );
function draw() {
	const levels = $.getSoundLevels( "music" );
	$.cls();
	$.rect( 10, 90, Math.round( levels.peak * 280 ), 20, 10 );
	requestAnimationFrame( draw );
}
draw();
"""

[[parameters]]
name = "bus"
type = "string"
description = "'sfx', 'music', 'audio', 'master', or 'output' (default: 'master')."
optional = true

[[parameters]]
name = "spectrum"
type = "boolean"
description = "Include frequency data in decibels (default: false)."
optional = true

[[parameters]]
name = "waveform"
type = "boolean"
description = "Include the time-domain samples (default: false)."
optional = true

[[returns]]
type = "{ peak: number; rms: number; spectrum: Float32Array | null; waveform: Float32Array | null }"
description = "Levels, plus spectrum and waveform arrays when requested."
