title = "startRecording"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Starts recording the sound output, or one bus, to memory."
description = """
Records what Pi.js plays, for saving as a WAV file with stopRecording() and saveRecording(). "output" records what the speakers receive. A bus name records that bus alone, after its effect and volume. "master" is recorded before the limiter.

Wait for the returned promise before playing anything that must be in the recording. Nothing is captured before the page's first click, key, or touch. At maxDuration capture stops and the samples are kept until stopRecording(). Only one recording runs at a time.
"""
example = """
$.screen( "300x200" );
$.print( "Press any key to record a tune" );
$.onKey( "any", "down", async () => {
	await $.startRecording();
	$.play( "T140 L8 O4 C E G O5 C4" );
	$.print( "Recording..." );
	setTimeout( async () => {
		const wav = await $.stopRecording();
		$.saveRecording( wav, "tune.wav" );
		$.print( "Saved tune.wav" );
	}, 2000 );
}, true );
"""

[[parameters]]
name = "bus"
type = "string"
description = "'output', 'master', 'sfx', 'music', or 'audio' (default: 'output')."
optional = true

[[parameters]]
name = "maxDuration"
type = "number"
description = "Longest recording in seconds, from 1 to 600 (default: 60)."
optional = true

[[parameters]]
name = "bitDepth"
type = "number"
description = "16 for 16-bit PCM or 32 for 32-bit float samples (default: 16)."
optional = true

[[returns]]
type = "Promise<void>"
typeDesc = "Promise"
description = "Resolves when capture is running."
