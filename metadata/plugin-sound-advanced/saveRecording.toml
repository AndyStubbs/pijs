title = "saveRecording"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Downloads a recording as a file."
description = """
Downloads a file, usually the WAV returned by stopRecording(), under the given name. Call it from an input handler, since browsers may block a download that does not follow a user action.
"""
example = """
$.screen( "300x200" );
$.print( "Press any key to record one second" );
$.onKey( "any", "down", async () => {
	await $.startRecording();
	$.sound( 220, 0.8 );
	setTimeout( async () => {
		const wav = await $.stopRecording();
		$.print( "Press any key to save" );
		$.onKey( "any", "down", () => {
			$.saveRecording( wav, "note.wav" );
		}, true );
	}, 1000 );
}, true );
"""

[[parameters]]
name = "blob"
type = "Blob"
description = "The file to save, such as the result of stopRecording()."

[[parameters]]
name = "filename"
type = "string"
description = "Name of the downloaded file (default: 'recording.wav')."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
