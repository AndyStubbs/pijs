title = "generateSfx"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Generates a retro sound effect as synth() options from a category and a seed."
description = """
Returns synth() options for a retro effect and plays nothing. Pass the result to synth() or definePreset(). The categories are "coin", "laser", "jump", "hit", "explosion", "powerup", "blip", "select", and "random".

The same category and seed return the same options every time. Seed 0 is the built-in preset with that name, except "random", which has no preset. Other seeds are different variants of the category.

variation randomly changes the numeric options. The waveform, filter type, and arpeggio stay the same. It is the only part of the result that is not repeatable.
"""
example = """
$.screen( "300x200" );
$.print( "Press L for the laser preset, V for a variant, H for a hit" );
$.definePreset( "zap", $.generateSfx( "laser", 42 ) );
$.onKey( "KeyL", "down", () => {
	$.synth( $.generateSfx( "laser" ) );
} );
$.onKey( "KeyV", "down", () => {
	$.sfx( "zap" );
} );
$.onKey( "KeyH", "down", () => {
	$.synth( $.generateSfx( "hit", 7, 0.15 ) );
} );
"""

[[parameters]]
name = "category"
type = "string"
description = "Sound category: coin, laser, jump, hit, explosion, powerup, blip, select, or random."

[[parameters]]
name = "seed"
type = "number"
description = "Integer from 0 to 4294967295 (default: 0, the built-in preset)."
optional = true

[[parameters]]
name = "variation"
type = "number"
description = "Random change to every numeric option, 0-1 (default: 0)."
optional = true

[[returns]]
type = "object"
description = "Frozen synth() options."
