title = "setBusEffect"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Places a reverb or delay effect on a sound bus."
description = """
Requires the sound-advanced plugin. Each bus ("sfx", "music", "audio", or "master") holds one effect; setting a new one replaces the old one, and null removes it. The bus volume is unchanged either way, and it applies after the effect, so muting a bus also silences the effect's tail.

"reverb" options: time, the length of the reverb tail in seconds (0.1-10, default 2); decay, how quickly the tail dies away (0.1-20, default 3); and mix, the share of reverberated sound (0-1, default 0.3).

"delay" options: time, the echo spacing in seconds (0.01-2, default 0.25); feedback, how much of each echo repeats (0-0.95, default 0.4); and mix, the share of echoed sound (0-1, default 0.3).
"""
example = """
$.setBusEffect( "music", "reverb", { "time": 2.5, "mix": 0.4 } );
$.setBusEffect( "sfx", "delay", { "time": 0.3, "feedback": 0.5 } );
$.screen( "300x200" );
$.print( "Press any key" );
$.onkey( "any", "down", () => {
	$.play( "T100 L4 O4 C E G O5 C" );
	$.sfx( "blip" );
} );
"""

[[parameters]]
name = "bus"
type = "string"
description = "'sfx', 'music', 'audio', or 'master'."

[[parameters]]
name = "effect"
type = "string | null"
description = "'reverb', 'delay', or null to remove the bus effect."

[[parameters]]
name = "options"
type = "object"
description = "Effect options: time, decay, and mix for reverb; time, feedback, and mix for delay."
optional = true
