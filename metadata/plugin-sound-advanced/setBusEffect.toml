title = "setBusEffect"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Places an effect, or a chain of effects, on a sound bus."
description = """
Puts one effect, or a chain of up to four, on a bus: "sfx", "music", "audio", or "master". A new effect replaces the old one. null or an empty array removes it. The bus volume still applies after the effect, so muting a bus also silences the effect's tail.

"reverb": time is the tail length in seconds (0.1-10, default 2), decay is how fast it dies away (0.1-20, default 3), and mix is the share of reverberated sound (0-1, default 0.3).

"delay": time is the echo spacing in seconds (0.01-2, default 0.25), feedback is how much each echo repeats (0-0.95, default 0.4), and mix is the share of echoed sound (0-1, default 0.3).

"filter": type is "lowpass", "highpass", or "bandpass" (default "lowpass"), cutoff is the frequency in Hz (20-20000, default 1000), and q is the resonance (0.0001-100, default 1).

"distortion": drive is the saturation (0-1, default 0.5), tone is a lowpass cutoff in Hz after the distortion (200-20000, default 4000), and mix is 0-1 (default 1).

"bitcrush": bits is the bit depth (1-16, default 8), rate is how many frames each sample is held (1-64, default 1), and mix is 0-1 (default 1).

"chorus": rate is the speed in Hz (0.1-10, default 1.5), depth is the delay modulation in milliseconds (0-10, default 3), and mix is 0-1 (default 0.5).

For a chain, pass an array of { effect, ...options } objects and omit options. The effects run in array order. Changing options on the current effect updates it. Changing a reverb's time or decay, or a filter's type, replaces the effect.
"""
example = """
$.setBusEffect( "sfx", "delay", { "time": 0.3, "feedback": 0.5 } );
$.setBusEffect( "music", [
	{ "effect": "filter", "cutoff": 20000 },
	{ "effect": "reverb", "time": 2.5, "mix": 0.4 }
] );
$.screen( "300x200" );
$.print( "Press a key to play" );
$.print( "Hold space to muffle the music" );
$.onKey( "any", "down", () => {
	$.play( "T100 L4 O4 C E G O5 C" );
	$.sfx( "blip" );
} );
$.onKey( "Space", "down", () => {
	$.setBusEffect( "music", [
		{ "effect": "filter", "cutoff": 600 },
		{ "effect": "reverb", "time": 2.5, "mix": 0.4 }
	] );
} );
$.onKey( "Space", "up", () => {
	$.setBusEffect( "music", [
		{ "effect": "filter", "cutoff": 20000 },
		{ "effect": "reverb", "time": 2.5, "mix": 0.4 }
	] );
} );
"""

[[parameters]]
name = "bus"
type = "string"
description = "'sfx', 'music', 'audio', or 'master'."

[[parameters]]
name = "effect"
type = "string | object[] | null"
description = "'reverb', 'delay', 'filter', 'distortion', 'bitcrush', or 'chorus'; an array of up to four { effect, ...options } objects for a chain; or null to remove the bus effect."

[[parameters]]
name = "options"
type = "object"
description = "Options of a single effect. Omit it for a chain."
optional = true
