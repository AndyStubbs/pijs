title = "getRecordingState"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Gets the recording state and the seconds recorded so far."
description = """
state is "idle" with no recording, "starting" while the first recording gets ready, "recording" while capturing, and "full" when the recording reached its maxDuration and is waiting for stopRecording().

duration is the seconds captured so far. It does not advance before the page's first click, key, or touch. It returns to 0 when the recording is stopped.
"""
example = """
$.screen( "300x200" );
$.print( "Press any key to start recording" );
$.onKey( "any", "down", () => {
	$.startRecording( "output", 5 );
	$.play( "T120 L4 O4 C D E F G A B O5 C" );
}, true );
function draw() {
	const recording = $.getRecordingState();
	$.cls();
	$.print( recording.state + " " + recording.duration.toFixed( 1 ) + " s" );
	requestAnimationFrame( draw );
}
draw();
"""
parameters = [ ]

[[returns]]
type = "{ state: \"idle\" | \"starting\" | \"recording\" | \"full\"; duration: number }"
description = "The recording state and the seconds captured so far."
