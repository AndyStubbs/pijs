title = "offPlay"
category = "sound"
isScreen = false
plugin = "sound-advanced"
summary = "Removes PLAY note or song end handlers registered with onPlay()."
description = """
Removes callbacks registered with onPlay(). A callback is identified by its mode and function.

With a mode and a function, removes that callback. Without a function, removes every callback of that mode. With no mode, removes the function from both modes.
"""
example = """
$.screen( "300x200" );
let notes = 0;
function countNote() {
	notes += 1;
	$.cls();
	$.print( "Notes: " + notes );
}
$.onPlay( "note", countNote );
$.onKey( "any", "down", () => {
	$.play( "T120 O4 L8 C D E F G A B O5 C" );
}, true );

// Stop counting after two seconds; the song keeps playing
setTimeout( () => {
	$.offPlay( "note", countNote );
}, 2000 );
"""

[[parameters]]
name = "mode"
type = "\"note\" | \"end\" | null"
typeDesc = "string"
description = "\"note\" or \"end\", or null to remove fn from both modes."
optional = true

[[parameters]]
name = "fn"
type = "function"
signature = "( data: { type: \"note\"; trackId: number; track: number; time: number; duration: number; frequency: number; volume: number; delay: number } | { type: \"end\"; trackId: number; stopped: boolean; delay: number } ) => void"
description = "Handler to remove. If omitted, every handler of the mode is removed."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
