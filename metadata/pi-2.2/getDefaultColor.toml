title = "getDefaultColor"
category = "colors"
isScreen = false
summary = "Gets the default foreground color used by new screens."
description = """
Returns the default drawing color for newly created screens. If asIndex is true, returns the palette index; otherwise returns the color value object.
"""
example = """
$.setDefaultColor( 9 );
$.print( `Default Color Index: ${$.getDefaultColor( true )}` );
$.print( `Default Color Value: [${$.getDefaultColor( false ).array.join( ", " )}]` );
"""

[[parameters]]
name = "asIndex"
type = "boolean"
description = "If true returns the palette index, otherwise returns a color value object."
optional = true

[[returns]]
type = "number | PiColor"
typeDesc = "*Many"
description = "Palette index if asIndex is true; otherwise a color value object."
