title = "loadImage"
category = "images"
isScreen = false
summary = "Loads an image by URL or from an Image/Canvas element."
description = """
Loads an image and stores it by name. Use $.ready() to wait for loading before calling drawImage.
Images retain their source colors when the screen palette changes. Use the shader API
for recoloring.
"""
example = """
$.screen( "300x200" );
$.loadImage( "media/player.png", "player" );
$.ready( () => {
	$.drawImage( "player", 150, 100 );
} );
"""

[[parameters]]
name = "src"
type = "string | HTMLImageElement | HTMLCanvasElement"
typeDesc = "*Many"
description = "Image source: URL string, HTMLImageElement, or HTMLCanvasElement."

[[parameters]]
name = "name"
type = "string"
description = "Optional unique name for the image. Auto-generated if omitted."
optional = true

[[parameters]]
name = "onLoad"
type = "function"
signature = "( name: string ) => void"
description = "Callback invoked when the image finishes loading."
optional = true

[[parameters]]
name = "onError"
type = "function"
signature = "( error: Error ) => void"
description = "Callback invoked if the image fails to load."
optional = true

[[returns]]
type = "string"
description = "The image name."
