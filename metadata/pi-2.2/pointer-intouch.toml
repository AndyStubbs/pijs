title = "intouch"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Gets the current touch state and starts tracking if needed."
description = """
Returns the current touch state for use in an animation loop. Tracking starts \
automatically if it has not been started yet.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
requestAnimationFrame( run );
function run() {
	const touches = $.intouch();
	for( const touch of touches ) {
		$.print( `Touch ${touch.id} at ${touch.x}, ${touch.y}` );
	}
	requestAnimationFrame( run );
}
"""

[[returns]]
type = "Array<TouchData>"
typeDesc = "*Array"
description = "Array of touch data objects."

