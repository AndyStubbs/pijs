title = "setPalColor"
category = "colors"
isScreen = true
summary = "Sets a color value in the current screen's palette."
description = ""
example = """
$.screen( "300x200" );
$.setColor( 2 );
$.print( "Hello" );
$.setPalColor( 2, "purple" );
$.print( "Hello" );
"""

[[parameters]]
name = "index"
type = "any"
description = "The index value of the color to change."

[[parameters]]
name = "color"
type = "any"
description = "Palette index or color value (string, array, object, number)."

[[returns]]
type = "void"
description = "This function does not return a value."
