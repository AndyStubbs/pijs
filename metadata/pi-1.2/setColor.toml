title = "setColor"
category = "colors"
isScreen = true
summary = "Sets the foreground color."
description = ""
example = """
var i, colors, x, y, size;

$.screen( "360x300" );
colors = $.getPal();
x = 0;
y = 0;
size = 20;
for( i = 0; i < colors.length; i++ ) {
\t$.setColor( i );
\t$.rect( x, y, size, size );
\t$.setPosPx( x + 1, y + 4 );
\t$.print( i, true );
\tx += size;
\tif( x >= $.width() ) {
\t\tx = 0;
\t\ty += size;
\t}
}
"""

[[parameters]]
name = "color"
type = "any"
description = "Palette index or color value (string, array, object, number)."

[[parameters]]
name = "isAddToPalette"
type = "boolean"
description = "If set to true and the color is not part of the current color palette then it will add it to the color palette."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
