title = "stopSound"
category = "sound"
isScreen = false
summary = "Stops sounds made from the sound command. Leave soundId blank to stop all sounds."
description = ""
example = """
var duration = 0.05;
var volume = 0.5;
var decay = 0.03;
var totalDuration = 0;
var i;
for( i = 0; i < 30; i++ ) {
\t$.sound(
\t\t240 + i * 8, duration, volume, "sawtooth", totalDuration, 0,
\t\tdecay
\t);
\ttotalDuration += duration + decay;
}

var timeout = setTimeout( function () {
\t$.stopSound();
}, 750 );
"""

[[parameters]]
name = "soundId"
type = "any"
description = "The soundId to be stopped."

[[returns]]
type = "void"
description = "This function does not return a value."
