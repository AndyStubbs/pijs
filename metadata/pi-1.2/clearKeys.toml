title = "clearKeys"
category = "keyboard"
isScreen = false
summary = "Clears event handlers for keyboard events."
description = ""
example = """
$.screen("300x200");
$.print("\\n");
$.onkey( "any", "down", function (key) {
\t$.print(key.key + " pressed.");
});
$.onkey( "Escape", "down", function (key) {
\t$.print(key.key + " pressed.");
\t$.clearKeys();
});"""

parameters = [ ]
[[returns]]
type = "void"
description = "This function does not return a value."
