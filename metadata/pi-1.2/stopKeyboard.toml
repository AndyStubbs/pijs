title = "stopKeyboard"
category = "keyboard"
isScreen = false
summary = "Stops tracking keyboard input."
description = ""
example = """
$.screen( "300x200" );

var hitbox = {
\t"x": 175,
\t"y": 75,
\t"width": 100,
\t"height": 100
};
var msg = "";
var isGreen = true;

$.onclick( clickBox, false, hitbox );
$.onkey( "any", "down", function ( key ) {
\tmsg = "You pressed " + key.key + ".";
\tdrawScreen();
} );
$.onkey( "any", "up", function ( key ) {
\tmsg = "";
\tdrawScreen();
} );

drawScreen();

function drawScreen() {
\t$.cls();
\t$.setColor( 7 );
\t$.print( "Press any key" );
\t$.print( "Click the box to toggle keyboard." );
\t$.print( isGreen ? "Keyboard enabled" : "Keyboard disabled" );
\t$.print( msg );
\t$.setColor( isGreen ? 2 : 4 );
\t$.rect( hitbox );
}

function clickBox() {
\tisGreen = !isGreen;
\tif( isGreen ) {
\t\t$.startKeyboard();
\t} else {
\t\t$.stopKeyboard();
\t}
\tdrawScreen();
}
"""

parameters = [ ]
[[returns]]
type = "void"
description = "This function does not return a value."
