title = "printTable"
category = "text"
isScreen = true
summary = "Prints a table on the screen."
description = ""
example = """
var data = [
\t[ "One", "2", "3", "FourSandwhiches", "EggMcMuffins", "6a" ],
\t[ "Hotdogs", "Five", "Six", "7", "8", "9" ],
\t[ "Seven", "Eight", "Nine", "a", "b", "c" ]
];
var format = [
\t"*-----------*---*---*---*----*",
\t"|           |   |   |V  |V   |",
\t"*----*------*---*---*   |    |",
\t"|    |      |       |   |    |",
\t"|    *------*       |   |    |",
\t"*----*      |       |   |    |",
\t"|    |      |       |   |    |",
\t"*----*------*-------*---*----*"
];
$.screen( "300x210" );
$.setColor( 2 );
$.setFont( 1 );
$.print( "12345678901234567890123456789012345678901234567890" );
$.setPos( 18, 2 );
$.printTable( data, format, null, false );
$.printTable( data, format, null, true );
$.printTable( data, null, null );
"""
[[parameters]]
name = "items"
type = "any"
description = "An array of strings that get put into the table from top-left to bottom-right order."

[[parameters]]
name = "tableFormat"
type = "any"
description = """
An array of strings that creates the table shape.
\t\t<ul style='margin:0'>
\t\t\t<li><span class='gray'>"*"</span> Indicates a table corner.</li>
\t\t\t<li><span class='gray'>"-"</span> Indicates a table horiztontal line.</li>
\t\t\t<li><span class='gray'>"|"</span> Indicates a table vertical line.</li>
\t\t\t<li><span class='gray'>"V"</span> Inside a cell for vertical orientation of the cell.</li>
\t\t</ul>"""
optional = true

[[parameters]]
name = "borderStyle"
type = "any"
description = "The style of borders. Must be one of the following strings single, double, singleDouble, doubleSingle, or thick."
optional = true

[[parameters]]
name = "isCentered"
type = "any"
description = "Horizontally centers the table."
optional = true

[[returns]]
type = "void"
description = "An array of data with information on each cell. Includes the position of each cell in the table."
