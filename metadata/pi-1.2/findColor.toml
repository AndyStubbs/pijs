title = "findColor"
category = "colors"
isScreen = true
summary = "Given a color value, find the index from the color palette."
description = ""
example = """
$.screen("300x200");
var color = $.findColor("red");
$.setColor(color);
$.print("The index of red is " + color + ".");
"""

[[parameters]]
name = "color"
type = "any"
description = "Palette index or color value (string, array, object, number)."

[[parameters]]
name = "tolerance"
type = "number"
description = "The percentage of how close the color has to be to match. Returns the fist match."
optional = true

[[parameters]]
name = "isAddToPalette"
type = "boolean"
description = "Add the color to the palette if its not found."
optional = true

[[returns]]
type = "void"
description = "The color index of the color found"
