title = "removeShader"
category = "shaders"
isScreen = false
summary = "Removes a custom shader and releases its cached GPU programs."
description = """
Completes every queued pass using the shader, clears it from active display screens, deletes its
cached WebGL program from every screen, and invalidates the handle for future use. Removing an
unknown or previously removed numeric handle is a no-op. Malformed handles throw
INVALID_SHADER_HANDLE synchronously.
"""
example = """
const invert = $.createShader( `#version 300 es
precision mediump float;
in vec2 v_texCoord;
uniform sampler2D u_texture;
out vec4 fragColor;
void main() {
	vec4 color = texture(u_texture, v_texCoord);
	fragColor = vec4(1.0 - color.rgb, color.a);
}` );

$.screen( "320x200" );
$.rect( 5, 5, 16, 16, "red" );
$.applyShader( invert );
$.rect( 32, 32, 16, 16, "red" );
$.removeShader( invert );
try {
	$.applyShader( invert );
} catch( ex ) {
	$.setPos( 0, 6 );
	$.print( ex.message );
}
"""

[[parameters]]
name = "shaderHandle"
type = "number"
description = "Shader handle returned by createShader."

[[returns]]
type = "void"
description = "This function does not return a value."
