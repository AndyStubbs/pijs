title = "createShader"
category = "shaders"
isScreen = false
summary = "Creates a custom fragment shader and returns a handle."
description = """
Creates a screen-independent shader from GLSL ES 3.00 fragment source. The vertex stage is built-in (fullscreen quad, v_texCoord). The WebGL program is compiled and validated synchronously the first time it is passed to applyShader or setDisplayShader for each screen, then cached for that screen.

The fragment source must include "#version 300 es". When first applied to a screen, the shader must declare uniform sampler2D u_texture. Invalid shaders throw synchronously without changing rendering state. Built-in uniforms, if declared: u_texture (sampler2D), u_sourceSize (vec2), u_outputSize (vec2), u_time (float), u_frame (int).

The second argument is an optional map of default custom uniform values. Values are interpreted
from the linked GLSL declaration and may include float, integer, unsigned integer, boolean, vector,
matrix, uniform-array, and sampler2D image inputs. Unknown and reserved built-in names are ignored.
"""
example = """
const invert = $.createShader( `#version 300 es
precision mediump float;
in vec2 v_texCoord;
uniform sampler2D u_texture;
out vec4 fragColor;
void main() {
	vec4 color = texture(u_texture, v_texCoord);
	fragColor = vec4(1.0 - color.rgb, color.a);
}` );

$.screen( "320x200" );
$.rect( 10, 10, 40, 40, 11 );
$.applyShader( invert );
$.line( 0, 0, 50, 50 );
"""

[[parameters]]
name = "fragmentSource"
type = "string"
description = "GLSL ES 3.00 fragment shader source. Must include \"#version 300 es\"."

[[parameters]]
name = "uniforms"
type = "ShaderUniforms"
description = "Optional reflected custom uniform values keyed by uniform name."
optional = true

[[returns]]
type = "number"
description = "Shader handle id for applyShader or setDisplayShader."
