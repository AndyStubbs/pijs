title = "getShaderInfo"
category = "shaders"
isScreen = true
summary = "Returns lifecycle and reflection diagnostics for a custom shader."
description = """
Returns a copied snapshot containing the shader source, default uniforms, and aggregate counts for
compiled screens, queued passes, and active display screens. When a current screen is available,
the result also describes that screen's compilation state, queued passes, display use, and
reflected uniforms.

This function never compiles the shader or allocates GPU resources. An unused shader reports an
uncompiled screen with an empty reflected-uniform list. Unknown handles throw
INVALID_SHADER_HANDLE synchronously.
"""
example = """
const invert = $.createShader( `#version 300 es
precision mediump float;
in vec2 v_texCoord;
uniform sampler2D u_texture;
uniform float u_gain;
uniform vec3 u_tint;
out vec4 fragColor;
void main() {
	vec4 color = texture(u_texture, v_texCoord);
	fragColor = vec4((1.0 - color.rgb) * u_tint * u_gain, color.a);
}`, {
	"u_gain": 0.75,
	"u_tint": [ 1, 0.8, 0.6 ]
} );

$.screen( "640x480" );
$.circle( 320, 240, 80, "red" );
$.applyShader( invert, { "u_gain": 0.5 } );
const info = $.getShaderInfo( invert );

$.setFont( 3 );
$.print( `Shader: ${info.id}` );
$.print();
$.print( "Source:" );
$.print( info.fragmentSource );
$.print();
$.print( "Default uniforms:" );
$.print( `  u_gain: ${info.uniforms.u_gain}` );
$.print( `  u_tint: ${info.uniforms.u_tint.join( ", " )}` );
$.print();
$.print( `Compiled screens: ${info.compiledScreenCount}` );
$.print( `Queued passes: ${info.queuedPassCount}` );
$.print( `Display screens: ${info.displayScreenCount}` );
$.print();
if( info.screen ) {
	$.print( "Current screen:" );
	$.print( `  Compiled: ${info.screen.compiled}` );
	$.print( `  Queued passes: ${info.screen.queuedPassCount}` );
	$.print( `  Display active: ${info.screen.displayActive}` );
	$.print( "  Reflected uniforms:" );
	for( const uniform of info.screen.uniforms ) {
		$.print( `    ${uniform.name}: ${uniform.type}, size ${uniform.size}, ` +
			`reserved ${uniform.reserved}` );
	}
}
"""

[[parameters]]
name = "shaderHandle"
type = "number"
description = "Shader handle returned by createShader."

[[returns]]
type = "ShaderInfo"
description = "Copied shader lifecycle and diagnostic information."
