title = "view"
category = "view"
isScreen = true
summary = "Sets or resets the active local drawing view."
description = """
Sets a local drawing coordinate system on the active screen. Drawing, text, cls,
reads, and paint then use local coordinates with 0,0 at the view origin. Pixels
are scissored to the effective clip (the requested rectangle intersected with
the parent clip). Internal clips are half-open: [x, x+width) x [y, y+height).

width() and height() return the requested local size, not the clipped size.
Zero-size views (0x0, 0xh, wx0) are valid. Print is a no-op and must not hang.

view(x, y, width, height) replaces the stack with one view relative to the full
screen and normalizes the print cursor into the new local range. view() with no
arguments clears the stack (full-screen root) and normalizes the cursor.

Changing the view flushes pending batches into the framebuffer. It does not
clear the screen. Multiple views in one render cycle stay visible together.
Negative width or height throws INVALID_PARAMETER.
"""
example = """
$.screen( "320x200" );
$.view( 20, 10, 120, 80 );
$.cls();
$.rect( 0, 0, $.width() - 1, $.height() - 1, "red" );
$.print( "inside view" );
$.view();
"""

[[parameters]]
name = "x"
type = "number"
description = "Left edge of the view in full-screen coordinates."
optional = true

[[parameters]]
name = "y"
type = "number"
description = "Top edge of the view in full-screen coordinates."
optional = true

[[parameters]]
name = "width"
type = "number"
description = "Requested local width in pixels. Must be 0 or greater."
optional = true

[[parameters]]
name = "height"
type = "number"
description = "Requested local height in pixels. Must be 0 or greater."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
