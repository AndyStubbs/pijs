title = "cls"
category = "effects"
isScreen = true
summary = "Clears the active view or a rectangular region."
description = """
Clears the active view or a rectangular local region. Coordinates are local
to the current view. The clear is clipped to the effective clip.

cls() with no arguments always resets the print cursor to (0, 0), even if
the view is only partially visible. Rectangular cls(x, y, width, height)
resets the cursor only when the rectangle is the full requested view
(0, 0, width(), height()). Partial rectangles do not reset the cursor.

applyShader and display shaders still process the full framebuffer. View
scissor is restored after an FBO shader pass.
"""
example = """
$.screen( "128x80" );
$.view( 8, 8, 80, 48 );
$.paint( 0, 0, 4 );
$.print( "red" );
$.cls();
$.print( "cleared" );
"""

[[parameters]]
name = "x"
type = "number"
description = "Local horizontal coordinate of the region to clear."
optional = true

[[parameters]]
name = "y"
type = "number"
description = "Local vertical coordinate of the region to clear."
optional = true

[[parameters]]
name = "width"
type = "number"
description = "Width of the region to clear."
optional = true

[[parameters]]
name = "height"
type = "number"
description = "Height of the region to clear."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
