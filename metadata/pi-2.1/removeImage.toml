title = "removeImage"
category = "images"
isScreen = false
summary = "Removes a previously loaded image by name."
description = """
Deletes the stored image and frees associated GPU resources (textures) for all screens. Draws already queued with the image complete before their textures are freed. Subsequent draws using the removed name throw IMAGE_NOT_FOUND.
"""
example = """
$.screen( "300x200" );
const playerA = document.createElement( "canvas" );
playerA.width = 32;
playerA.height = 32;
const context = playerA.getContext( "2d" );
context.fillStyle = "red";
context.font = "16pt Arial Bold";
context.fillText( "A", 0, 16 );
$.loadImage( playerA, "player" );
$.drawImage( "player", 5, 5 );
$.removeImage( "player" );
try {
	$.drawImage( "player", 5, 21 );
} catch( error ) {
	$.print( error.code );
}
"""

[[parameters]]
name = "name"
type = "string"
description = "Image name to remove."

[[returns]]
type = "void"
description = "This function does not return a value."
