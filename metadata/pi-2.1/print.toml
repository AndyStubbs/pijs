title = "print"
category = "text"
isScreen = true
summary = "Prints text in the active view and advances the cursor."
description = """
Prints text at the current cursor using the active bitmap font. Wrap, setPos
bounds, cols/rows, and the bottom scroll bound use the requested local view
size. Scroll only shifts pixels inside the effective clip.

Zero-size views are a no-op and must not hang. getCols() and getRows() are 0
in a 0-width or 0-height view.

Direct setPos still clamps only when the position is past the local bound.
setPosPx does not clamp. view(), view reset, and framebuffer resize always
normalize the stored cursor into [0, width] x [0, height]. Insertion at
exactly width or height stays valid. pushView/popView save and restore the
parent cursor.
"""
example = """
$.screen( "320x200" );
$.setFont( 1 );
$.view( 16, 16, 120, 64 );
$.print( "Welcome to Pi.js" );
$.print( "Wrapped in the view" );
"""

[[parameters]]
name = "msg"
type = "string"
description = "Text message to print. If omitted, prints an empty line."
optional = true

[[parameters]]
name = "isInline"
type = "boolean"
description = "If true, cursor stays on the same line after printing instead of advancing to next line."
optional = true

[[parameters]]
name = "isCentered"
type = "boolean"
description = "If true, centers the text horizontally in the current view."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
