title = "loadAudio"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Loads an audio file for playback with playAudio."
description = """
Loads an audio file and returns an audio ID for playAudio. By default the file is decoded, so many instances can play it at once. Set stream to true for long files such as music: that uses less memory and plays one instance at a time.

The file loads in the background. Call $.ready() before playing it. The page must be served over HTTP or HTTPS, and a cross-origin file needs CORS headers.
"""
example = """
$.screen( "300x200" );
$.loadAudio( "media/bomb.wav", "bomb" );
$.ready( function () {
	$.print( "Press any key to play bomb sound." );
	$.onKey( "any", "down", () => {
		$.print( "BOOM ", true );
		$.playAudio( "bomb" );
	}, false, true );
} );
"""

[[parameters]]
name = "src"
type = "string"
description = "Audio file URL (e.g., 'sound.mp3', 'audio/beep.wav')."

[[parameters]]
name = "name"
type = "string"
description = "A unique name to use as the audio ID. If omitted, an ID is generated."
optional = true

[[parameters]]
name = "stream"
type = "boolean"
description = "True to stream the file through a media element instead of decoding it into memory (default: false)."
optional = true

[[returns]]
type = "string"
description = "Audio ID for use with playAudio, stopAudio, pauseAudio, resumeAudio, and removeAudio."
