title = "pauseAudio"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Pauses an audio instance, every instance of an audio ID, or all audio."
description = """
Pauses audio and keeps its position, so resumeAudio continues from there. Pass an instance ID, an audio ID to pause every instance of that file, or nothing to pause all audio. Pausing an instance that has not started yet cancels its start.
"""
example = """
$.screen( "300x200" );
const music = $.loadAudio( "media/sound.wav" );
let instance = null;
let paused = false;
$.ready( function () {
	$.print( "Press any key to play, then to pause and resume" );
	$.onKey( "any", "down", () => {
		if( instance === null ) {
			instance = $.playAudio( { "audioId": music, "loop": true } );
		} else if( paused ) {
			$.resumeAudio( instance );
			paused = false;
		} else {
			$.pauseAudio( instance );
			paused = true;
		}
	} );
} );
"""

[[parameters]]
name = "id"
type = "number | string"
description = "Instance ID, or audio ID to pause all its instances. If omitted, pauses all audio."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
