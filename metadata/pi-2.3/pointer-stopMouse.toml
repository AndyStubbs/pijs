title = "stopMouse"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Stops mouse input tracking for this screen."
description = """
Stops mouse tracking until startMouse(). Held buttons are released through the 'up' callbacks with cancelled set to true, and no click fires. While stopped, callbacks stay registered but are not called, and inMouse() returns null. Reads and new callbacks do not restart tracking.
"""
example = """
$.screen( "300x200" );
$.print( "Mouse will be stopped in 3 seconds." );
$.onMouse( "move", ( mouseData ) => {
	$.setPosPx( mouseData.x, mouseData.y );
	var pos = $.getPos();
	$.setPos( pos.col, pos.row );
	$.setColor( 13 );
	$.print( "+", true );
} );
setTimeout( () => {
	$.setPos( 0, 1 );
	$.setColor( 7 );
	$.print( "Mouse is stopped" );
	$.stopMouse();
}, 3000 );
"""

[[returns]]
type = "void"
description = "This function does not return a value."
