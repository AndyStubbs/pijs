title = "offMouse"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Removes a mouse event handler."
description = """
Removes callbacks registered with onMouse. A callback is identified by its mode and function.

With a mode and a function, removes that callback. Without a function, removes every callback of the mode. With a function and no mode, removes the function from every mode.
"""
example = """
$.screen( "300x200" );
$.print( "Move mouse to paint screen, click to stop." );
$.onMouse( "move", mouseMove );
$.onMouse( "up", mouseStop, true );

// Mouse move function receives mouseData and optional customData
function mouseMove( mouseData, customData ) {
	$.setPosPx( mouseData.x, mouseData.y );
	var pos = $.getPos();
	$.setPos( pos.col, pos.row );
	$.setColor( 8 );
	$.print( "+", true );
}

// Mouse stop function receives mouseData and optional customData
function mouseStop( mouseData, customData ) {
	$.setColor( 14 );
	var pos = $.getPos();
	$.setPos( pos.col - 4, pos.row );
	$.print( "Stopped!", true );
	$.offMouse( "move", mouseMove );
}
"""

[[parameters]]
name = "mode"
type = "string | null"
description = "Mode ('down', 'up', or 'move'); if omitted or null, fn is removed from every mode."
optional = true

[[parameters]]
name = "fn"
type = "function"
signature = "( mouseData: MouseData, customData?: object ) => void"
description = "Callback function to remove. If omitted or null, removes every handler of the mode."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
