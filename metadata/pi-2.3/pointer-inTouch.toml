title = "inTouch"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Gets the current touch state and starts tracking if needed."
description = """
Returns the touches still down, ordered by identifier, as new objects on each call; the array is
empty when no touch is down. Each touch has its own action. Tracking starts on the first read
unless stopTouch() was called.

A touch that starts on the canvas border or padding is not tracked. Held touches are released when
the page is hidden or stopTouch() is called.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
requestAnimationFrame( run );
function run() {
	$.cls();
	const touches = $.inTouch();
	for( const touch of touches ) {
		$.print( `Touch ${touch.id} at ${touch.x}, ${touch.y}` );
	}
	requestAnimationFrame( run );
}
"""

[[returns]]
type = "Array<TouchData>"
typeDesc = "*Array"
description = "Touches still down; empty when none is down."
