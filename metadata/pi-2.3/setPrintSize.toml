title = "setPrintSize"
category = "text"
isScreen = true
summary = "Sets the scale factor for printed text."
description = """
Sets the horizontal and vertical scale of printed bitmap text, and optional extra space between characters. Omitted values keep their current setting.
"""
example = """
$.screen( "320x200" );
$.setFont( 1 );
$.print( "Normal size" );
$.setPrintSize( 2, 2 );
$.print( "Double size" );
$.setPrintSize( { "scaleWidth": 1, "scaleHeight": 2.5 } );
$.print( "Ultra thin tall font" );
"""

[[parameters]]
name = "scaleWidth"
type = "number"
description = "Horizontal scale factor; a number greater than 0."
optional = true

[[parameters]]
name = "scaleHeight"
type = "number"
description = "Vertical scale factor; a number greater than 0."
optional = true

[[parameters]]
name = "padX"
type = "number"
description = "Extra horizontal padding between characters in pixels; an integer of 0 or more. Defaults to 0."
optional = true

[[parameters]]
name = "padY"
type = "number"
description = "Extra vertical padding between lines in pixels; an integer of 0 or more. Defaults to 0."
optional = true


[[returns]]
type = "void"
description = "This function does not return a value."
