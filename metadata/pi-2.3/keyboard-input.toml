title = "input"
category = "keyboard"
isScreen = true
plugin = "keyboard"
summary = "Prompts the user for text input with a blinking cursor."
description = """
Displays a prompt at the print cursor and waits for the user to type a value. Enter completes
the input and Escape cancels it. Returns a Promise that resolves with the value, or null if the
input is cancelled, and optionally calls a callback function with the same value.

The prompt keeps to one line: when the value would reach the right edge, the end of the value
is shown. After the input ends, printing continues at column 0 of the line below the prompt.

While the prompt is active it reads keys itself, so it works even after stopKeyboard(). It
prevents the default action of the keys it handles, so typing does not scroll the page or move
focus. Shortcuts with Ctrl or Meta are left to the browser, except AltGr, which types; pasted
text is inserted one character at a time by the same rules as typed text. Keys typed into an
editable element on the page, such as an input field, are ignored. Keys held when the prompt
starts are released through the onKey() "up" handlers, with cancelled set to true.

With isNumber or isInteger, the value is a number. Only digits, one decimal point unless
isInteger is set, and a leading minus sign with allowNegative are accepted. Typing "-" adds the
minus sign at the start, and "+" removes it; the minus sign counts toward maxLength. A value
with no digits resolves to 0.

The input is cancelled by cancelInput(), by clearEvents( "keyboard" ) called with no screen or
from the screen that owns the prompt, by removing that screen, or by starting another input.

The prompt and cursor are strings, the callback a function, and isNumber, isInteger, and
allowNegative booleans; maxLength is an integer of at least 1. Omitted values, null or
undefined, take their defaults. Invalid options throw a TypeError, or a RangeError for a
maxLength below 1, with code INVALID_PROMPT, INVALID_FUNCTION, INVALID_CURSOR,
INVALID_IS_NUMBER, INVALID_IS_INTEGER, INVALID_ALLOW_NEGATIVE, or INVALID_MAX_LENGTH.
"""
example = """
$.screen( "300x200" );
$.input( "Enter your name: ", async ( name ) => {
	$.print( `Hello, ${name}!` );
	const age = await $.input( {
		"prompt": "Enter age: ",
		"isInteger": true,
		"maxLength": 3
	} );
	$.print( `You are ${age} years old.` );
} );
"""

[[parameters]]
name = "prompt"
type = "string"
description = "Prompt text to display before the input field."

[[parameters]]
name = "fn"
type = "function"
signature = "( value: string | number | null ) => void"
description = "Optional callback function called with the input value, or null if cancelled."
optional = true

[[parameters]]
name = "cursor"
type = "string"
description = "Cursor character to display. Omitted or empty, it is character code 219, which the built-in fonts draw as a block."
optional = true

[[parameters]]
name = "isNumber"
type = "boolean"
description = "If true, only accepts a number and resolves with a number."
optional = true

[[parameters]]
name = "isInteger"
type = "boolean"
description = "If true, only accepts an integer, with no decimal point, and resolves with a number, with or without isNumber."
optional = true

[[parameters]]
name = "allowNegative"
type = "boolean"
description = "If true, a numeric input accepts a leading minus sign."
optional = true

[[parameters]]
name = "maxLength"
type = "number | null"
typeDesc = "number"
description = "Maximum length of the input, at least 1, including a minus sign. Null or omitted for no limit."
optional = true

[[returns]]
type = "Promise<string | number | null>"
typeDesc = "Promise"
description = "Promise that resolves with the input value, a number for numeric input, or null if cancelled."
