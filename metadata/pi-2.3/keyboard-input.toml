title = "input"
category = "keyboard"
isScreen = true
plugin = "keyboard"
summary = "Prompts the user for text input with a blinking cursor."
description = """
Shows a prompt at the print cursor and waits for the user to type. Enter completes the input and Escape cancels it. Returns a Promise that resolves with the value, or null when cancelled, and calls fn with the same value when fn is given.

The prompt stays on one line. When it ends, printing continues on the next line. It reads keys itself, so it works after stopKeyboard(). Keys typed into the prompt do not reach onKey() or inKey().

With isNumber or isInteger, only a number is accepted and the promise resolves with a number. isInteger rejects a decimal point. allowNegative accepts a leading minus sign. A value with no digits resolves to 0.

The prompt is also cancelled by cancelInput(), by clearEvents( "keyboard" ) on its screen, by removing that screen, or by starting another input.
"""
example = """
$.screen( "300x200" );
$.input( "Enter your name: ", async ( name ) => {
	$.print( `Hello, ${name}!` );
	const age = await $.input( {
		"prompt": "Enter age: ",
		"isInteger": true,
		"maxLength": 3
	} );
	$.print( `You are ${age} years old.` );
} );
"""

[[parameters]]
name = "prompt"
type = "string"
description = "Prompt text to display before the input field."

[[parameters]]
name = "fn"
type = "function"
signature = "( value: string | number | null ) => void"
description = "Optional callback function called with the input value, or null if cancelled."
optional = true

[[parameters]]
name = "cursor"
type = "string"
description = "Cursor character to display. Omitted or empty, it is character code 219, which the built-in fonts draw as a block."
optional = true

[[parameters]]
name = "isNumber"
type = "boolean"
description = "If true, only accepts a number and resolves with a number."
optional = true

[[parameters]]
name = "isInteger"
type = "boolean"
description = "If true, only accepts an integer, with no decimal point, and resolves with a number, with or without isNumber."
optional = true

[[parameters]]
name = "allowNegative"
type = "boolean"
description = "If true, a numeric input accepts a leading minus sign."
optional = true

[[parameters]]
name = "maxLength"
type = "number | null"
typeDesc = "number"
description = "Maximum length of the input, at least 1, including a minus sign. Null or omitted for no limit."
optional = true

[[returns]]
type = "Promise<string | number | null>"
typeDesc = "Promise"
description = "Promise that resolves with the input value, a number for numeric input, or null if cancelled."
