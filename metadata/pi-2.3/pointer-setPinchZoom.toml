title = "setPinchZoom"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Enables or disables browser pinch zoom on the screen canvas."
description = """
Controls whether a pinch that starts on the screen canvas zooms the page. Pass false, or omit the argument, to keep those touches for the screen. Pass true to let the pinch zoom the page.

The setting does not start touch tracking. set( { "pinchZoom": ... } ) calls this command.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.setPinchZoom( true ); // Let a pinch on the canvas zoom the page
$.setPinchZoom( false ); // Keep every touch on the canvas for the game
"""

[[parameters]]
name = "isEnabled"
type = "boolean"
description = "If true, a pinch on the canvas zooms the page. If false, it does not."

[[returns]]
type = "void"
description = "This function does not return a value."
