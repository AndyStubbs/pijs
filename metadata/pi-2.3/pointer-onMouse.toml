title = "onMouse"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Registers a callback function for mouse events."
description = """
Registers a callback for mouse events. The callback receives the mouse data and any custom data. Pens are included, with type set to 'pen'. With a hitBox, the callback runs only for events inside it.

'down' runs when a button is pressed, 'move' when the pointer moves, and 'up' when a button is released. A press that starts on the canvas border or padding is ignored. A press on the canvas keeps reporting moves after it leaves the canvas, and 'up' runs for the release anywhere. 'up' also runs with cancelled set to true when the browser cancels the pointer, the page is hidden, or stopMouse() is called while a button is held.

once removes the callback before its first run. Registering starts tracking unless stopMouse() was called.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.onMouse( "down", ( mouseData ) => {
	$.setPosPx( mouseData.x, mouseData.y );
	$.print( `(${mouseData.x}, ${mouseData.y})` );
} );

// With hit box
const hitBox = { "x": 10, "y": 10, "width": 100, "height": 50 };
$.setColor( 2 );
$.rect( hitBox );
$.setColor( 7 );
$.onMouse( "move", ( mouseData ) => {
	$.setColor( 3 );
	$.pset( mouseData.x, mouseData.y );
	$.setColor( 7 );
}, false, hitBox );

// One-time handler
$.onMouse( "up", () => {
	$.setPos( 0, 12 )
	$.print( "Mouse released once", true, true );
}, true );
"""

[[parameters]]
name = "mode"
type = "string"
description = "Event mode: 'down', 'up', or 'move'."

[[parameters]]
name = "fn"
type = "function"
signature = "( mouseData: MouseData, customData?: object ) => void"
description = "Callback function that receives (mouseData, customData)."

[[parameters]]
name = "once"
type = "boolean"
description = "If true, this registration is removed before the callback's first run."
optional = true

[[parameters]]
name = "hitBox"
type = "HitBox"
description = "Optional area; the callback runs only for events inside it."
optional = true

[[parameters]]
name = "customData"
type = "any"
description = "Optional custom data passed to the callback function."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
