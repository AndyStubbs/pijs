title = "onMouse"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Registers a callback function for mouse events."
description = """
Registers a callback that runs when a mouse event occurs, with the mouse data and the optional
custom data. Mouse commands also observe pens, whose data has type set to 'pen'. With a hitBox,
the callback runs only for events inside it. Registering starts tracking unless stopMouse() was
called.

A press that starts on the canvas border or padding is ignored. A press on the canvas keeps
reporting moves while it leaves the canvas, and 'up' runs for its release anywhere. 'up' also runs
with cancelled set to true when the browser cancels the pointer, the page is hidden, or stopMouse()
is called with a button held; moves and releases report their true position, which can be outside
the screen.

A handler runs until it is removed. A handler is identified by its mode and callback:
registering the same callback for the same mode again does nothing, whatever its once, hitBox, and
customData, and offMouse removes it by those two. once removes the registration before the handler
runs. Handlers added during an event first run for the next event; a handler removed during an
event does not run later in it. A handler that throws is reported with console.error(), and the
other handlers still run.

The mode is 'down', 'up', or 'move', and once is a boolean or omitted. Invalid arguments throw a
TypeError for a wrong type or a RangeError for an unknown mode or a negative hitBox size, with
code INVALID_MODE, INVALID_FUNCTION, INVALID_ONCE, or INVALID_HITBOX.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.onMouse( "down", ( mouseData ) => {
	$.setPosPx( mouseData.x, mouseData.y );
	$.print( `(${mouseData.x}, ${mouseData.y})` );
} );

// With hit box
const hitBox = { "x": 10, "y": 10, "width": 100, "height": 50 };
$.setColor( 2 );
$.rect( hitBox );
$.setColor( 7 );
$.onMouse( "move", ( mouseData ) => {
	$.setColor( 3 );
	$.pset( mouseData.x, mouseData.y );
	$.setColor( 7 );
}, false, hitBox );

// One-time handler
$.onMouse( "up", () => {
	$.setPos( 0, 12 )
	$.print( "Mouse released once", true, true );
}, true );
"""

[[parameters]]
name = "mode"
type = "string"
description = "Event mode: 'down', 'up', or 'move'."

[[parameters]]
name = "fn"
type = "function"
signature = "( mouseData: MouseData, customData?: object ) => void"
description = "Callback function that receives (mouseData, customData)."

[[parameters]]
name = "once"
type = "boolean"
description = "If true, this registration is removed before the callback's first run."
optional = true

[[parameters]]
name = "hitBox"
type = "HitBox"
description = "Optional area; the callback runs only for events inside it."
optional = true

[[parameters]]
name = "customData"
type = "any"
description = "Optional custom data passed to the callback function."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
