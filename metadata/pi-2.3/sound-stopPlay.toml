title = "stopPlay"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Stops playing music tracks."
description = """
Stops one music track, or every track when trackId is omitted. Notes that are playing fade out. Notes that have not started are cancelled.
"""
example = """
$.screen( "300x200" );
$.print( "Press any key to hear sound" );
$.onKey( "any", "down", () => {
	$.play( "T120 O4 L4 CDEF GAB>C ABCDEFG" );
	setTimeout( () => {
		$.stopPlay();
	}, 500 );
} );
"""

[[parameters]]
name = "trackId"
type = "number"
description = "Track ID to stop. If null, stops all tracks."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
