title = "getImage"
category = "images"
isScreen = false
summary = "Resolves a registered image, direct image source, or screen."
description = """
Returns the underlying Image or Canvas element for a registered image name. Direct image,
video, canvas, ImageBitmap, ImageData, and OffscreenCanvas sources are returned as supplied.
An onscreen Screen returns its canvas; an offscreen Screen returns a new canvas containing a
copy of its logical framebuffer pixels.
"""
example = """
$.screen( "300x200" );
$.loadImage( "media/player.png", "player" );
$.ready( () => {
	const img = $.getImage( "player" );
	$.drawImage( img, 150, 100, null, 0.5, 0.5, 1, 1, 0 );
} );
"""

[[parameters]]
name = "name"
type = "string | Screen | HTMLImageElement | HTMLVideoElement | HTMLCanvasElement | ImageBitmap | ImageData | OffscreenCanvas"
typeDesc = "*Many"
description = "Registered image name, Screen, or direct image source."

[[returns]]
type = "HTMLImageElement | HTMLVideoElement | HTMLCanvasElement | ImageBitmap | ImageData | OffscreenCanvas"
typeDesc = "*HTMLElement"
description = "The resolved source, or a canvas containing the screen's pixels."
