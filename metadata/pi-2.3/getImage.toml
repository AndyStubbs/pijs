title = "getImage"
category = "images"
isScreen = false
summary = "Gets the image element by name, or a screen's canvas."
description = """
Returns the underlying Image or Canvas element for a previously loaded image. Given a screen, it
returns the screen's canvas; for an offscreen screen, which has no canvas of its own, it returns a
new canvas holding a copy of the screen's pixels.
"""
example = """
$.screen( "300x200" );
$.loadImage( "media/player.png", "player" );
$.ready( () => {
	const img = $.getImage( "player" );
	$.drawImage( img, 150, 100, null, 0.5, 0.5, 1, 1, 0 );
} );
"""

[[parameters]]
name = "name"
type = "string | Screen"
typeDesc = "*Many"
description = "Image name, or a screen."

[[returns]]
type = "HTMLImageElement | HTMLCanvasElement"
typeDesc = "*HTMLElement"
description = "The actual Image or Canvas element."
