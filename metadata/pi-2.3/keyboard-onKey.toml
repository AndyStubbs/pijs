title = "onKey"
category = "keyboard"
isScreen = false
plugin = "keyboard"
summary = "Registers a callback function for key events."
description = """
Registers a callback for key presses and releases. Name a key by its code (for example "KeyA"), which is the physical key, or by its key value (for example "a"), which is the character it types.

'down' runs when the key is pressed and receives its key data. 'up' runs when the key is released and receives the key data at release. "any" listens for every key.

Pass an array of keys for a combination. It runs when all of those keys are held, and the callback receives an array of their key data. A combination's 'up' callback runs when one of its keys is released while the rest are still held.

'up' also runs, with cancelled set to true, when a held key is released because the window loses focus, the page is hidden, stopKeyboard() is called, or an input() prompt starts.

once removes the callback before its first run. allowRepeat lets a 'down' callback run again while the key is held. Registering starts tracking unless stopKeyboard() was called. Keys typed into an input() prompt, or into an editable element on the page, are ignored.
"""
example = """
$.screen( "300x200" );

// Game controls use codes, which name the physical key on every layout
$.onKey( "KeyW", "down", () => {
	$.print( "Up" );
} );
$.onKey( "Space", "down", () => {
	$.print( "Jump" );
} );

// Key combination
$.onKey( [ "ControlLeft", "KeyS" ], "down", ( keys ) => {
	$.print( "Ctrl+S pressed!" );
} );

// One-time handler
$.onKey( "Enter", "down", () => {
	$.print( "Enter pressed once!" );
}, true );

// Listen for any key
$.onKey( "any", "down", ( keyData ) => {
	$.print( `Key ${keyData.key} pressed` );
} );
"""

[[parameters]]
name = "key"
type = "string | array"
typeDesc = "*Many"
description = "Key code/key value string, array of keys for combinations, or \"any\" for any key."

[[parameters]]
name = "mode"
type = "string"
description = "Event mode: \"up\" for key release, \"down\" for key press."

[[parameters]]
name = "fn"
type = "function"
signature = "( keyData: object | object[] ) => void"
description = "Callback function that receives the key data, or an array of key data for a combination."

[[parameters]]
name = "once"
type = "boolean"
description = "If true, the handler is removed after being called once."
optional = true

[[parameters]]
name = "allowRepeat"
type = "boolean"
description = "If true, allows the handler to fire on key repeat (when key is held down)."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
