title = "setActionKeys"
category = "keyboard"
isScreen = false
plugin = "keyboard"
summary = "Sets the keys whose default browser behavior is prevented."
description = """
Sets the action keys, replacing the previous set. The browser's default behavior is prevented for these keys, such as scrolling with the arrow keys or Space.

Pass every action key in one call. An empty array clears them. set( { "actionKeys": [ ... ] } ) sets them the same way. Keys can be a code (for example "ArrowUp") or a key value (for example " "). Setting them starts keyboard tracking unless stopKeyboard() was called.
"""
example = """
$.screen( "200x200" );
$.setActionKeys( [ "ControlLeft", "KeyS" ] );
setInterval( function () {
	const keys = $.inKey();
	$.cls();
	$.print( "Press Ctrl+S." );
	if( $.inKey( "Control" ) ) {
		$.print( "Control key is pressed." );
	} else {
		$.print( "Control key is not pressed." );
	}
	for( const keyData of keys ) {
		$.print( "--------------------------" );
		$.print( "key:      " + keyData.key );
		$.print( "location: " + keyData.location );
		$.print( "code:     " + keyData.code );
	}
}, 60 );
"""

[[parameters]]
name = "keys"
type = "Array<string>"
typeDesc = "*Array"
description = "Array of key codes or key values that become the action keys."

[[returns]]
type = "void"
description = "This function does not return a value."
