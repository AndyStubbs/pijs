title = "registerPlugin"
category = "plugins"
isScreen = false
summary = "Registers a plugin to extend Pi.js with custom commands and features."
description = """
Registers a plugin that adds commands and screen behavior. init receives a pluginApi object and uses it to add commands, screen data, and event handlers. Those methods work only while init runs. See PluginAPI for the methods.

version and description are stored for getPlugins. dependencies names plugins that must initialize first. A plugin with a missing or cyclic dependency stays pending. If init fails, the plugin's state is "failed", and registering that name again retries it.

If screens already exist, the plugin is installed on them. Screens created later get the same commands and data.
"""
example = """
$.registerPlugin( {
	"name": "octogon",
	"version": "1.0.0",
	"description": "Poly plugin",
	"dependencies": [],
	"init": ( pluginApi ) => {
		pluginApi.addCommand( "poly", ( screenData, options ) => {
			const x = options.x ?? 0;
			const y = options.y ?? 0;
			const radius = options.radius ?? 1;
			const sides = options.sides ?? 1;
			let angle = 0
			const fillColor = options.fillColor;
			let da = ( Math.PI * 2 ) / sides;
			let x2 = null;
			let y2 = null;
			for( let i = 0; i < sides + 1; i += 1 ) {
				let x1 = x + Math.cos( angle ) * radius;
				let y1 = y + Math.sin( angle ) * radius;
				if( x2 !== null ) {
					screenData.api.line( x1, y1, x2, y2 );
				}
				x2 = x1;
				y2 = y1;
				angle += da;
			}
			if( fillColor !== null ) {
				screenData.api.paint( x, y, fillColor );
			}
		}, true, [ "x", "y", "radius", "sides", "fillColor" ] );
	}
} );
$.screen( "300x200" );
$.setColor( 15 );
$.poly( 150 , 100, 15, 8, "red" );
"""

[[parameters]]
name = "name"
type = "string"
description = "Unique plugin name."

[[parameters]]
name = "init"
type = "function"
signature = "( pluginApi: PluginAPI ) => void"
description = "Initialization function that receives pluginApi."

[[parameters]]
name = "version"
type = "string"
description = "Optional plugin version."
optional = true

[[parameters]]
name = "description"
type = "string"
description = "Optional plugin description."
optional = true

[[parameters]]
name = "dependencies"
type = "Array<string>"
typeDesc = "*Array"
description = "Optional list of dependency plugin names."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
