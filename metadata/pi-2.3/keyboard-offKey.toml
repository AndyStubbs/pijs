title = "offKey"
category = "keyboard"
isScreen = false
plugin = "keyboard"
summary = "Removes a key event handler."
description = """
Removes callbacks registered with onKey. A callback is identified by its key, mode, and function. A combination matches when it has the same keys, in any order.

With a key, a mode, and a function, removes that callback. Without a function, removes every callback of that mode for the key. With a function and no mode, removes the function from both modes.
"""
example = """
$.screen( "300x200" );
$.print( "Move with the arrow keys." );
$.print( "Press Escape to stop." );
$.onKey( "ArrowLeft", "down", moveLeft );
$.onKey( "ArrowRight", "down", moveRight );
$.onKey( "Escape", "down", stop );

function moveLeft() {
	$.print( "Left" );
}

function moveRight() {
	$.print( "Right" );
}

// Remove each handler, then the Escape handler itself
function stop() {
	$.print( "Stopped." );
	$.offKey( "ArrowLeft", "down", moveLeft );
	$.offKey( "ArrowRight", "down", moveRight );
	$.offKey( "Escape", "down" );
}
"""

[[parameters]]
name = "key"
type = "string | array"
typeDesc = "*Many"
description = "Key code, key value, \"any\", or combination array of the handlers to remove."

[[parameters]]
name = "mode"
type = "string | null"
description = "Event mode (\"up\" or \"down\"). If omitted or null, fn is removed from both modes."
optional = true

[[parameters]]
name = "fn"
type = "function"
signature = "( keyData: object | object[] ) => void"
description = "Callback to remove. If omitted, every handler of the mode is removed."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
