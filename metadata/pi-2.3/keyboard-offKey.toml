title = "offKey"
category = "keyboard"
isScreen = false
plugin = "keyboard"
summary = "Removes a key event handler."
description = """
Removes key event handlers registered with onKey. A handler is identified by its key or
combination, its mode, and its callback; the once and allowRepeat flags it was registered with
do not matter. A combination matches when it holds the same keys, in any order.

With a key, a mode, and a callback, removes that handler. Without a callback, removes every
handler of the mode for the key. With a callback and no mode (null, or no mode in the object
form), removes the callback from both modes. A key alone throws a TypeError with code
INVALID_MODE; clearEvents( "keyboard" ) removes every key handler.

A handler removed while a key event is being dispatched does not run later in that dispatch.
"""
example = """
$.screen( "300x200" );
$.print( "Move with the arrow keys." );
$.print( "Press Escape to stop." );
$.onKey( "ArrowLeft", "down", moveLeft );
$.onKey( "ArrowRight", "down", moveRight );
$.onKey( "Escape", "down", stop );

function moveLeft() {
	$.print( "Left" );
}

function moveRight() {
	$.print( "Right" );
}

// Remove each handler, then the Escape handler itself
function stop() {
	$.print( "Stopped." );
	$.offKey( "ArrowLeft", "down", moveLeft );
	$.offKey( "ArrowRight", "down", moveRight );
	$.offKey( "Escape", "down" );
}
"""

[[parameters]]
name = "key"
type = "string | array"
typeDesc = "*Many"
description = "Key code, key value, \"any\", or combination array of the handlers to remove."

[[parameters]]
name = "mode"
type = "string | null"
description = "Event mode (\"up\" or \"down\"). If omitted or null, fn is removed from both modes."
optional = true

[[parameters]]
name = "fn"
type = "function"
signature = "( keyData: object | object[] ) => void"
description = "Callback to remove. If omitted, every handler of the mode is removed."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
