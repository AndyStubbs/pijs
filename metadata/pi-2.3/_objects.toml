[[objects]]
title = "PluginAPI"
summary = "Plugin API object for extending Pi.js functionality."
description = """
Plugin API object passed to plugin initialization functions. Provides access to Pi.js internals for registering commands, adding screen data, and extending functionality.
"""

[[objects.properties]]
name = "addCommand"
type = "function"
signature = "( name: string, fn: ( ...args: any[] ) => any, isScreen: boolean, parameterNames: string[], isScreenOptional?: boolean ) => void"
description = "During init, register a new command."

[[objects.properties]]
name = "addScreenDataItem"
type = "function"
signature = "( name: string, defaultValue: any ) => void"
description = "During init, add persistent data to each screen."

[[objects.properties]]
name = "addScreenDataItemGetter"
type = "function"
signature = "( name: string, getterFn: Function ) => void"
description = "During init, add a dynamic data getter for screens."

[[objects.properties]]
name = "addScreenInitFunction"
type = "function"
signature = "( initFn: Function ) => void"
description = "During init, register a function to run when screens are created."

[[objects.properties]]
name = "addScreenPreCleanupFunction"
type = "function"
signature = "( cleanupFn: ( screenData: any ) => void ) => void"
description = "During init, register a function to run after isRemoved is set, before renderer cleanup; it cancels work without redrawing."

[[objects.properties]]
name = "addScreenCleanupFunction"
type = "function"
signature = "( cleanupFn: Function ) => void"
description = "During init, register a function to run when screens are destroyed."

[[objects.properties]]
name = "getActiveScreen"
type = "function"
signature = "( fnName: string, isScreenOptional?: boolean ) => any"
description = "Return the active screen data, or throw if none unless isScreenOptional is true."

[[objects.properties]]
name = "getScreenData"
type = "function"
signature = "( fnName: string, screenId: number ) => any"
description = "Get data for a specific screen by its numeric ID."

[[objects.properties]]
name = "getAllScreensData"
type = "function"
signature = "() => any[]"
description = "Get array of all screen data objects."

[[objects.properties]]
name = "resizeOffscreenScreen"
type = "function"
signature = "( screenData: any, width: number, height: number ) => void"
description = "Resize an offscreen screen to integer dimensions."

[[objects.properties]]
name = "getApi"
type = "function"
signature = "() => Pi.API"
description = "Get the main Pi.js API object."

[[objects.properties]]
name = "utils"
type = "object"
description = "Access to utility functions."

[[objects.properties]]
name = "wait"
type = "function"
signature = "() => void"
description = "Increment resource wait counter (for async operations)."

[[objects.properties]]
name = "done"
type = "function"
signature = "() => void"
description = "Decrement resource wait counter."

[[objects.properties]]
name = "registerClearEvents"
type = "function"
signature = "( name: string, handler: Function ) => void"
description = "During init, register a clearEvents handler for a specific event type."

[[objects.properties]]
name = "provideService"
type = "function"
signature = "( service: object ) => void"
description = "During init, publish one service object for plugins that depend on this plugin."

[[objects.properties]]
name = "getService"
type = "function"
signature = "( pluginName: string ) => any"
description = "Return the service of an initialized plugin named in this plugin's dependencies."

# ============================================================================
# HitBox
# ============================================================================
[[objects]]
title = "HitBox"
summary = "Rectangular area used for hit detection in event handlers."
description = """
A rectangular area in screen pixels that restricts a pointer handler (onClick, onMouse, onPress, onTouch) to input inside it. A point is inside when x <= point.x < x + width and y <= point.y < y + height, so the left and top edges are included and the right and bottom edges are not.

Every value must be a finite number, and fractions are allowed. Positions may be negative;
width and height must be zero or greater.
"""

[[objects.properties]]
name = "x"
type = "number"
description = "Left edge X coordinate in pixels."

[[objects.properties]]
name = "y"
type = "number"
description = "Top edge Y coordinate in pixels."

[[objects.properties]]
name = "width"
type = "number"
description = "Width of the rectangle in pixels; 0 or more."

[[objects.properties]]
name = "height"
type = "number"
description = "Height of the rectangle in pixels; 0 or more."

# ============================================================================
# MouseData
# ============================================================================
[[objects]]
title = "MouseData"
summary = "Mouse state and event data."
description = """
Mouse data containing position, button state, action, and previous position. Returned by inMouse() and passed to onMouse callbacks. Mouse, touch, press, and click data share one shape: x, y, lastX, lastY, buttons, action, type, id, and cancelled. The data is created once per event and frozen: reads and handlers of the event receive the same object.

Positions are in screen pixels. Moves over the canvas border or padding, and a release outside the canvas, report their true position, which can be outside the screen.
"""

[[objects.properties]]
name = "x"
type = "number"
description = "X coordinate in pixels."

[[objects.properties]]
name = "y"
type = "number"
description = "Y coordinate in pixels."

[[objects.properties]]
name = "lastX"
type = "number"
description = "X coordinate before this event; the current X on a pointer's first event."

[[objects.properties]]
name = "lastY"
type = "number"
description = "Y coordinate before this event; the current Y on a pointer's first event."

[[objects.properties]]
name = "buttons"
type = "number"
description = """
Bitmask of the buttons held (0 = none, 1 = left, 2 = right, 4 = middle). Only buttons pressed on the screen count: a press that starts on the canvas border, the padding, or outside the canvas is not held.
"""

[[objects.properties]]
name = "action"
type = "string"
description = "Last action: 'down', 'move', or 'up'."

[[objects.properties]]
name = "type"
type = "string"
description = "Input type: 'pen' for a pen, otherwise 'mouse'."

[[objects.properties]]
name = "id"
type = "number"
description = "Pointer identifier of the mouse or pen."

[[objects.properties]]
name = "cancelled"
type = "boolean"
description = """
True for a release the player did not make: the browser cancelled the pointer, the page was hidden, or stopMouse() was called with a button held. False otherwise.
"""

# ============================================================================
# PressData
# ============================================================================
[[objects]]
title = "PressData"
summary = "Press state data (mouse or touch)."
description = """
Press data from the primary pointer: the mouse, or the primary touch. Returned by inPress() and passed to onPress callbacks; type tells which input it came from. It has the fields of MouseData or TouchData, plus touches. A touch is primary when it starts with no other touch down, and stays primary until it lifts; after that, no touch is primary until every touch is up.

Press data is created once per event and frozen, and can be serialized with JSON.stringify().
"""

[[objects.properties]]
name = "x"
type = "number"
description = "X coordinate in pixels."

[[objects.properties]]
name = "y"
type = "number"
description = "Y coordinate in pixels."

[[objects.properties]]
name = "lastX"
type = "number"
description = "X coordinate before this event; the current X on a pointer's first event."

[[objects.properties]]
name = "lastY"
type = "number"
description = "Y coordinate before this event; the current Y on a pointer's first event."

[[objects.properties]]
name = "buttons"
type = "number"
description = "Mouse: the MouseData button bitmask. Touch: 1 while the primary touch is down, 0 after."

[[objects.properties]]
name = "action"
type = "string"
description = "Last action: 'down', 'move', or 'up'."

[[objects.properties]]
name = "type"
type = "string"
description = "Input type: 'mouse', 'pen', or 'touch'."

[[objects.properties]]
name = "id"
type = "number"
description = "Pointer identifier of the mouse, pen, or primary touch."

[[objects.properties]]
name = "cancelled"
type = "boolean"
description = "True for a release the player did not make, as in MouseData and TouchData."

[[objects.properties]]
name = "touches"
type = "Array<TouchData>"
description = "The frozen inTouch() list of the touches still down; empty for the mouse."

# ============================================================================
# ClickData
# ============================================================================
[[objects]]
title = "ClickData"
summary = "Click event data (mouse or touch)."
description = """
The data of the release that completed a click, passed to onClick callbacks, with action 'click'. It has the MouseData or TouchData fields of the release, and is frozen.
"""

[[objects.properties]]
name = "x"
type = "number"
description = "X coordinate of the release in pixels."

[[objects.properties]]
name = "y"
type = "number"
description = "Y coordinate of the release in pixels."

[[objects.properties]]
name = "lastX"
type = "number"
description = "X coordinate before the release."

[[objects.properties]]
name = "lastY"
type = "number"
description = "Y coordinate before the release."

[[objects.properties]]
name = "buttons"
type = "number"
description = "Buttons still held after the release."

[[objects.properties]]
name = "action"
type = "string"
description = "Always 'click'."

[[objects.properties]]
name = "type"
type = "string"
description = "Input type: 'mouse', 'pen', or 'touch'."

[[objects.properties]]
name = "id"
type = "number"
description = "Pointer identifier of the mouse, pen, or touch that clicked."

[[objects.properties]]
name = "cancelled"
type = "boolean"
description = "Always false: a cancelled release never clicks."

# ============================================================================
# TouchData
# ============================================================================
[[objects]]
title = "TouchData"
summary = "Single touch point data."
description = """
Data for one touch point. inTouch() returns the touches still down, and onTouch callbacks receive the touch the event changed, in an array. Touch data is created once per event and frozen: the touch in the handlers' array is the same object inTouch() lists.
"""

[[objects.properties]]
name = "x"
type = "number"
description = """
Current X coordinate in pixels. A touch that moves or ends outside the screen reports its true position, which can be outside the screen.
"""

[[objects.properties]]
name = "y"
type = "number"
description = "Current Y coordinate in pixels."

[[objects.properties]]
name = "lastX"
type = "number"
description = "X coordinate before this event; the current X on the touch's first event."

[[objects.properties]]
name = "lastY"
type = "number"
description = "Y coordinate before this event; the current Y on the touch's first event."

[[objects.properties]]
name = "buttons"
type = "number"
description = "1 while the touch is down, 0 when it ends."

[[objects.properties]]
name = "action"
type = "string"
description = "This touch's last action: 'down', 'move', or 'up'."

[[objects.properties]]
name = "type"
type = "string"
description = "Input type, always 'touch' for touch data."

[[objects.properties]]
name = "id"
type = "number"
description = "Touch identifier, the same for every event of one touch."

[[objects.properties]]
name = "cancelled"
type = "boolean"
description = """
True for an end the player did not make: the browser cancelled the touch, the page was hidden, or stopTouch() was called. False otherwise.
"""

# ============================================================================
# WheelData
# ============================================================================
[[objects]]
title = "WheelData"
summary = "Wheel event data."
description = """
Data for one wheel event, passed to onWheel callbacks. It is created once per event and frozen. Deltas are in CSS pixels: positive deltaY scrolls down, and positive deltaX scrolls right.
"""

[[objects.properties]]
name = "x"
type = "number"
description = "X coordinate of the pointer in pixels; outside the screen over the border."

[[objects.properties]]
name = "y"
type = "number"
description = "Y coordinate of the pointer in pixels."

[[objects.properties]]
name = "deltaX"
type = "number"
description = "Horizontal scroll amount in CSS pixels."

[[objects.properties]]
name = "deltaY"
type = "number"
description = "Vertical scroll amount in CSS pixels; positive when the wheel turns down."

# ============================================================================
# GamepadDisconnectData
# ============================================================================
[[objects]]
title = "GamepadDisconnectData"
summary = "Data passed to onGamepad( 'disconnect' ) callbacks."
description = "The disconnected pad's identity. "

[[objects.properties]]
name = "index"
type = "number"
description = "Index the pad had."

[[objects.properties]]
name = "id"
type = "string"
description = "The browser's id string for the pad."

[[objects.properties]]
name = "mapping"
type = "string"
description = "The pad's mapping, such as 'standard'."

[[objects.properties]]
name = "connected"
type = "boolean"
description = "Always false."

# ============================================================================
# GamepadButton
# ============================================================================
[[objects]]
title = "GamepadButton"
summary = "State of one gamepad button."
description = """
One entry of GamepadData.buttons. It is live: the same object is updated in place on each read.
"""

[[objects.properties]]
name = "pressed"
type = "boolean"
description = "Whether the button is held."

[[objects.properties]]
name = "value"
type = "number"
description = "How far the button is pressed, from 0 to 1."

[[objects.properties]]
name = "pressStarted"
type = "boolean"
description = "Whether the button was pressed since the previous read."

[[objects.properties]]
name = "pressReleased"
type = "boolean"
description = "Whether the button was released since the previous read."

# ============================================================================
# GamepadData
# ============================================================================
[[objects]]
title = "GamepadData"
summary = "Gamepad state and helper methods."
description = """
A connected gamepad, returned by inGamepad() and passed to onGamepad( "connect" ) callbacks. The object is live: the same object is returned on every read and updated in place, including its buttons array, each button, axes, and lastAxes. Copy values to keep a snapshot.
"""

[[objects.properties]]
name = "index"
type = "number"
description = "The browser's index for the pad, a non-negative integer."

[[objects.properties]]
name = "id"
type = "string"
description = "Gamepad identifier string."

[[objects.properties]]
name = "connected"
type = "boolean"
description = "Connection status."

[[objects.properties]]
name = "mapping"
type = "string"
description = "Gamepad mapping type, such as 'standard', or an empty string."

[[objects.properties]]
name = "timestamp"
type = "number"
description = "The browser's timestamp of the pad state at the last read."

[[objects.properties]]
name = "vibrationActuator"
type = "any"
description = "The browser's vibration actuator for the pad, or null. See vibrateGamepad()."

[[objects.properties]]
name = "buttons"
type = "Array<GamepadButton>"
description = "Button states, in the browser's button order."

[[objects.properties]]
name = "axes"
type = "Array<number>"
description = "Axis values from -1 to 1 after the dead zone set by setGamepadDeadZone()."

[[objects.properties]]
name = "lastAxes"
type = "Array<number>"
description = "Axis values at the previous read."

[[objects.properties]]
name = "getButton"
type = "function"
signature = "( buttonIndex: number | string ) => GamepadButton | null"
description = "Reads the button object, or null past the buttons array."

[[objects.properties]]
name = "getButtonPressed"
type = "function"
signature = "( buttonIndex: number | string ) => boolean"
description = "Reads whether the button is held; false past the buttons array."

[[objects.properties]]
name = "getButtonJustPressed"
type = "function"
signature = "( buttonIndex: number | string ) => boolean"
description = "Reads whether the button was pressed since the previous read; false past the array."

[[objects.properties]]
name = "getButtonJustReleased"
type = "function"
signature = "( buttonIndex: number | string ) => boolean"
description = "Reads whether the button was released since the previous read; false past the array."

[[objects.properties]]
name = "getAxis"
type = "function"
signature = "( axisIndex: number | string ) => number"
description = "Reads the axis value; 0 past the axes array."

[[objects.properties]]
name = "getAxisChanged"
type = "function"
signature = "( axisIndex: number | string ) => boolean"
description = "Reads whether the axis value differs from the previous read; false past the array."
