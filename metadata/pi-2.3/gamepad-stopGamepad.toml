title = "stopGamepad"
category = "gamepad"
isScreen = false
plugin = "gamepad"
summary = "Stops the gamepad input loop."
description = """
Stops polling until startGamepad(). While stopped, inGamepad() returns an empty array and
inGamepad( index ) returns null; neither reads nor onGamepad() registrations restart polling. Every
button is released and the axes read 0, without reporting a release, as when the page is hidden: a
pad kept from an earlier read reports no button held.

Connection callbacks are not called while stopped, and pads do not join or leave the list.
startGamepad() catches up: pads that disconnected while stopped are removed through the
'disconnect' callbacks, and the 'connect' callbacks receive the pads that connected.
"""
example = """
$.screen( "300x200" );
$.print( "Connect gamepad and press a button or move an axis to connect" );
$.onGamepad( "connect", ( gamepad ) => {
	$.print( `Gamepad ${gamepad.index} connected: ${gamepad.id}` );
	setTimeout( () => {
		$.print( "Gamepad is now stopped" );
		$.stopGamepad();
	}, 3000 );
} );

run();
function run() {
	const gamepad = $.inGamepad( 0 );
	if( gamepad ) {
		const vAxis = gamepad.getAxis( 0 );
		$.cls();
		$.print( "Game will stop in 3 seconds" );
		$.circle( Math.floor( 300 * ( vAxis / 2 ) ) + 150, 100, 8 );
	}
	requestAnimationFrame( run );
}
"""

[[returns]]
type = "void"
description = "This function does not return a value."
