title = "startMouse"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Starts mouse input tracking for this screen."
description = """
Starts mouse tracking on the screen canvas. Tracking also starts on first use: the first inMouse(),
inPress(), or handler registration. After stopMouse(), only startMouse() starts tracking again.

When the page is hidden, held buttons are released through the 'up' handlers, with cancelled set to
true.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.stopMouse();
$.print( "Mouse will be enabled in 3 seconds." );
$.onMouse( "move", ( mouseData ) => {
	$.setPosPx( mouseData.x, mouseData.y );
	var pos = $.getPos();
	$.setPos( pos.col, pos.row );
	$.setColor( 13 );
	$.print( "+", true );
} );
setTimeout( () => {
	$.setPos( 0, 1 );
	$.setColor( 7 );
	$.print( "Mouse is enabled" );
	$.startMouse();
}, 3000 );
"""

[[returns]]
type = "void"
description = "This function does not return a value."
