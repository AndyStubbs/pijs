title = "startMouse"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Starts mouse input tracking for this screen."
description = """
Starts mouse tracking. Tracking also starts on the first inMouse(), inPress(), or mouse callback, so this is only needed after stopMouse(). Calling it while tracking is already running does nothing.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.stopMouse();
$.print( "Mouse will be enabled in 3 seconds." );
$.onMouse( "move", ( mouseData ) => {
	$.setPosPx( mouseData.x, mouseData.y );
	var pos = $.getPos();
	$.setPos( pos.col, pos.row );
	$.setColor( 13 );
	$.print( "+", true );
} );
setTimeout( () => {
	$.setPos( 0, 1 );
	$.setColor( 7 );
	$.print( "Mouse is enabled" );
	$.startMouse();
}, 3000 );
"""

[[returns]]
type = "void"
description = "This function does not return a value."
