title = "offGamepad"
category = "gamepad"
isScreen = false
plugin = "gamepad"
summary = "Removes a gamepad connection or disconnection callback."
description = """
Removes callbacks registered with onGamepad. A callback is identified by its mode and function;
the 'once' parameter is not used to identify the callback.

A callback removed during a dispatch does will not run later. 
"""
example = """
$.screen( "300x200" );
function onConnect( gamepad ) {
	$.print( `Gamepad ${gamepad.index} connected: ${gamepad.id}` );

	// Only the first connection is announced
	$.offGamepad( "connect", onConnect );
}
$.onGamepad( "connect", onConnect );
"""

[[parameters]]
name = "mode"
type = "string | null"
description = "'connect' or 'disconnect'. If omitted or null, fn is removed from both modes."
optional = true

[[parameters]]
name = "fn"
type = "function"
signature = "( data: GamepadData | GamepadDisconnectData ) => void"
description = "Callback to remove. If omitted or null, every callback of the mode is removed."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
