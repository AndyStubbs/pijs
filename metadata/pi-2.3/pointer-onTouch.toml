title = "onTouch"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Registers a callback function for touch events."
description = """
Registers a callback for touch events. The callback receives the touch that changed, in an array, and any custom data. Each touch is reported on its own. Use inTouch() for every touch still down.

'down' receives the touch that started, 'move' the touch that moved, and 'up' the touch that ended. With a hitBox, the callback receives only the changed touches inside it. A touch that starts on the canvas border or padding is ignored. A touch that starts on the canvas keeps reporting moves and its end after it leaves the canvas. 'up' also runs with cancelled set to true when the browser cancels a touch, the page is hidden, or stopTouch() is called.

While touch is tracked, the browser does not scroll or zoom from touches that start on the canvas. once removes the callback before its first run. Registering starts tracking unless stopTouch() was called.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.onTouch( "down", ( touches ) => {
	for( const touch of touches ) {
		$.setPosPx( touch.x, touch.y );
		$.print( `Touch ${touch.id} started` );
	}
} );

$.onTouch( "move", ( touches ) => {
	$.setColor( 3 );
	for( const touch of touches ) {
		$.line( touch.lastX, touch.lastY, touch.x, touch.y );
	}
	$.setColor( 7 );
} );
"""

[[parameters]]
name = "mode"
type = "string"
description = "Event mode: 'down', 'up', or 'move'."

[[parameters]]
name = "fn"
type = "function"
signature = "( touches: Array<TouchData>, customData?: object ) => void"
description = "Callback function that receives (touches, customData) with the changed touches."

[[parameters]]
name = "once"
type = "boolean"
description = "If true, this registration is removed before the callback's first run."
optional = true

[[parameters]]
name = "hitBox"
type = "HitBox"
description = "Optional area; the callback receives only the changed touches inside it."
optional = true

[[parameters]]
name = "customData"
type = "any"
description = "Optional custom data passed to the callback function."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
