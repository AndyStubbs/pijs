title = "onTouch"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Registers a callback function for touch events."
description = """
Registers a callback that runs when a touch event occurs, with the touches the event changed and
the optional custom data: 'start' receives the touches that started, 'move' the touches that moved,
and 'end' the touches that ended, at the position where they lifted. Use inTouch() for every touch
still down.

With a hitBox, the callback receives only the changed touches inside it, and runs only when there
is one. 'end' also runs with cancelled set to true when the browser cancels a touch, the page is
hidden, or stopTouch() is called. A touch that starts on the canvas border or padding is ignored.
While touch is tracked, touchstart on the canvas is prevented, which stops browser gestures that
start there. Registering starts tracking unless stopTouch() was called.

A handler runs until it is removed. Registering the same function again adds a second registration,
and once removes only its own registration, before the handler runs. Handlers added during an event
first run for the next event; a handler removed during an event does not run later in it. A handler
that throws is reported with console.error(), and the other handlers still run.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.onTouch( "start", ( touches ) => {
	for( const touch of touches ) {
		$.setPosPx( touch.x, touch.y );
		$.print( `Touch ${touch.id} started` );
	}
} );

$.onTouch( "move", ( touches ) => {
	$.setColor( 3 );
	for( const touch of touches ) {
		$.line( touch.lastX, touch.lastY, touch.x, touch.y );
	}
	$.setColor( 7 );
} );
"""

[[parameters]]
name = "mode"
type = "string"
description = "Event mode: 'start', 'end', or 'move'."

[[parameters]]
name = "fn"
type = "function"
signature = "( touches: Array<TouchData>, customData?: object ) => void"
description = "Callback function that receives (touches, customData) with the changed touches."

[[parameters]]
name = "once"
type = "boolean"
description = "If true, this registration is removed before the callback's first run."
optional = true

[[parameters]]
name = "hitBox"
type = "HitBox"
description = "Optional area; the callback receives only the changed touches inside it."
optional = true

[[parameters]]
name = "customData"
type = "any"
description = "Optional custom data passed to the callback function."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
