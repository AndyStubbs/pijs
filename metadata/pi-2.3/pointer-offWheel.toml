title = "offWheel"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Removes a wheel event handler."
description = """
Removes a wheel callback registered with onWheel. If fn is omitted, removes every wheel callback on the screen. When the last one is removed, the page scrolls with the wheel over the canvas again.
"""
example = """
$.screen( "300x200" );
let turns = 0;
const handler = ( wheelData ) => {
	turns += 1;
	$.print( `Wheel ${turns}: ${wheelData.deltaY}` );
	if( turns === 5 ) {
		$.offWheel( handler );
		$.print( "Wheel handler removed; the page scrolls again." );
	}
};
$.onWheel( handler );
"""

[[parameters]]
name = "fn"
type = "function"
signature = "( wheelData: WheelData, customData?: object ) => void"
description = "Callback function to remove. If omitted or null, removes every wheel handler."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
