title = "loadFont"
category = "text"
isScreen = false
summary = "Loads a bitmap font from an image source."
description = """
Loads a bitmap font from an image URL, or from an Image or Canvas element. Characters are arranged in a grid. Each cell is the character size plus the margin on each side.

If charset is omitted, the font uses character codes 0-255. charset can be an array of character codes or a string of characters. Returns a font ID for setFont. Call $.ready() before using the font.
"""
example = """
const fontId = $.loadFont( {
	"src": "media/gnsh.png",
	"width": 5,
	"height": 12,
	"margin": 0,
	"charset": " !\\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\\\]" +
			   "^_`abcdefghijklmnopqrstuvwxyz{|}~"
} );
$.ready( () => {
	$.screen( "300x200" );
	$.setFont( fontId );
	$.setBgColor( "#555" );
	$.setPosPx( 0, 85 );
	$.print( "The quick brown fox jumped over the lazy dogs! 123456789", true, true );
} );
"""

[[parameters]]
name = "src"
type = "string | HTMLImageElement | HTMLCanvasElement"
typeDesc = "*Many"
description = "Font image source: URL string, Image element, or Canvas element."

[[parameters]]
name = "width"
type = "number"
description = "Character width in pixels (glyph width, excluding margin); an integer of at least 1."

[[parameters]]
name = "height"
type = "number"
description = "Character height in pixels (glyph height, excluding margin); an integer of at least 1."

[[parameters]]
name = "margin"
type = "number"
description = "Margin around each character cell in pixels; an integer of 0 or more. Defaults to 0."
optional = true

[[parameters]]
name = "charset"
type = "Array<number> | string"
typeDesc = "*Many"
description = "Character set as array of character codes or string. Defaults to 0-255 (ASCII) if not provided."
optional = true

[[returns]]
type = "number"
description = "Font ID that can be used with setFont."
