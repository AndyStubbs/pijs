title = "startKeyboard"
category = "keyboard"
isScreen = false
plugin = "keyboard"
summary = "Starts keyboard input monitoring."
description = """
Starts the keyboard input monitoring system by adding the keydown and keyup listeners, and the
blur and page-visibility listeners that release held keys.
The keyboard also starts on first use: the first inKey() call, onKey() registration, or
setActionKeys() call, including set( { "actionKeys": [ ... ] } ). The plugin adds no listener
before then, so keys pressed earlier are not tracked. This command is needed only after
stopKeyboard(), which nothing else undoes. Calling it again while the keyboard is running has
no effect, and starting keeps the focused element's focus.
"""
example = """
$.screen( "300x200" );
$.stopKeyboard();
$.print( "Keyboard will be enabled in 3 seconds." );
$.onKey( "any", "down", () => {
	$.print( "Key pressed!" );
} );
setTimeout( () => {
	$.print( "Keyboard is enabled" );
	$.startKeyboard();
}, 3000 );
"""

[[returns]]
type = "void"
description = "This function does not return a value."
