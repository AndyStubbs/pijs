title = "startKeyboard"
category = "keyboard"
isScreen = false
plugin = "keyboard"
summary = "Starts keyboard input monitoring."
description = """
Starts keyboard tracking. Tracking also starts on the first inKey(), onKey(), or setActionKeys() call, so this is only needed after stopKeyboard(). Calling it while the keyboard is already running does nothing. Keys pressed before tracking starts are not reported.
"""
example = """
$.screen( "300x200" );
$.stopKeyboard();
$.print( "Keyboard will be enabled in 3 seconds." );
$.onKey( "any", "down", () => {
	$.print( "Key pressed!" );
} );
setTimeout( () => {
	$.print( "Keyboard is enabled" );
	$.startKeyboard();
}, 3000 );
"""

[[returns]]
type = "void"
description = "This function does not return a value."
