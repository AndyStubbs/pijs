title = "startKeyboard"
category = "keyboard"
isScreen = false
plugin = "keyboard"
summary = "Starts keyboard input monitoring."
description = """
Starts the keyboard input monitoring system by adding the keydown and keyup listeners. The
keyboard starts when the plugin loads, so this command is only needed after stopKeyboard().
Registering a handler or calling inKey() does not restart a stopped keyboard. Calling it again
while the keyboard is running has no effect, and starting keeps the focused element's focus.
"""
example = """
$.screen( "300x200" );
$.stopKeyboard();
$.print( "Keyboard will be enabled in 3 seconds." );
$.onKey( "any", "down", () => {
	$.print( "Key pressed!" );
} );
setTimeout( () => {
	$.print( "Keyboard is enabled" );
	$.startKeyboard();
}, 3000 );
"""

[[returns]]
type = "void"
description = "This function does not return a value."
