title = "setChar"
category = "text"
isScreen = true
summary = "Sets a custom character bitmap in the current font."
description = """
Replaces one character's bitmap in the current font. data is a 2D array of 0 and 1, or a hex string. The character must exist in the font.

The font is shared, so the change shows on every screen that uses it the next time the character is printed. Text already printed keeps the old glyph.
"""
example = """
$.screen( "300x200" );
$.setFont( 2 );
$.setChar( 97, "1092ba547cc6fe92" );
$.setChar( 98, "423c2418187e1818" );
$.setChar( 99, "7cd67cfec6aafe00" );
$.setChar( 100, "00183c667e5a42c3" );
$.setChar( 101, "008199FFDBFFBD18" );

$.print( " abcde f" );
"""

[[parameters]]
name = "charCode"
type = "number | string"
typeDesc = "*Many"
description = "Character code (number) or single-character string to modify."

[[parameters]]
name = "data"
type = "array | string"
typeDesc = "*Many"
description = "Character bitmap as 2D array [[row...], ...] where 1=on, 0=off, or hex-encoded string."

[[returns]]
type = "void"
description = "This function does not return a value."
