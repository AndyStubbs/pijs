title = "stopSound"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Stops a playing sound or all sounds."
description = """
Stops one sound, or every sound when soundId is omitted. A sound that is playing fades out. A delayed sound that has not started is cancelled.
"""
example = """
$.screen( "300x200" );
$.print( "Press any key to hear sound" );
$.onKey( "any", "down", () => {
	const soundId = $.sound( 440, 5 );
	setTimeout( () => {
		$.stopSound( soundId );
	}, 500 );
} );
"""

[[parameters]]
name = "soundId"
type = "string"
description = "Sound ID returned from sound(). If null, stops all sounds."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
