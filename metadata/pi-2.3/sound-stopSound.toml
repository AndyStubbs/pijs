title = "stopSound"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Stops a playing sound or all sounds."
description = """
Stops a specific sound by sound ID, or stops all sounds if soundId is null. A sound that is playing fades out over 10 ms, so it is silent about 15 ms after the call. A delayed sound that has not started is cancelled. IDs of sounds that have already finished, or were never played, are ignored.
"""
example = """
$.screen( "300x200" );
$.print( "Press any key to hear sound" );
$.onkey( "any", "down", () => {
	const soundId = $.sound( 440, 5 );
	setTimeout( () => {
		$.stopSound( soundId );
	}, 500 );
} );
"""

[[parameters]]
name = "soundId"
type = "string"
description = "Sound ID returned from sound(). If null, stops all sounds."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
