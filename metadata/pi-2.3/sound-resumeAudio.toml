title = "resumeAudio"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Resumes a paused audio instance, every instance of an audio ID, or all audio."
description = """
Resumes paused audio from its saved position. Pass an instance ID, an audio ID to resume every paused instance of that file, or nothing to resume all paused audio. Volume, rate, and pan changes made while paused apply on resume.
"""
example = """
$.screen( "300x200" );
const music = $.loadAudio( "media/sound.wav" );
let instance = null;
$.ready( function () {
	$.print( "Hold any key to play the music" );
	$.onKey( "any", "down", () => {
		if( instance === null ) {
			instance = $.playAudio( { "audioId": music, "loop": true } );
		} else {
			$.resumeAudio( instance );
		}
	} );
	$.onKey( "any", "up", () => {
		if( instance !== null ) {
			$.pauseAudio( instance );
		}
	} );
} );
"""

[[parameters]]
name = "id"
type = "number | string"
description = "Instance ID, or audio ID to resume all its instances. If omitted, resumes all paused audio."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
