title = "setAudio"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Changes the volume, playback rate, or pan of an audio instance."
description = """
Changes a playing, delayed, or paused instance. Omitted values stay as they are. playbackRate changes speed and pitch together, and stays in the range for how the audio was loaded: 0.0625 to 16 for decoded audio, and 0.25 to 4 for streamed audio. A rate change also changes how long the rest of the instance lasts. Changes to a paused instance apply when it resumes.
"""
example = """
$.screen( "300x200" );
const engine = $.loadAudio( "media/sound.wav" );
let instance = null;
let rate = 1;
$.ready( function () {
	$.print( "Press up and down to change the pitch" );
	$.onKey( "any", "down", key => {
		if( instance === null ) {
			instance = $.playAudio( { "audioId": engine, "loop": true, "volume": 0.5 } );
		}
		if( key.key === "ArrowUp" ) {
			rate = Math.min( rate * 1.1, 4 );
		} else if( key.key === "ArrowDown" ) {
			rate = Math.max( rate / 1.1, 0.25 );
		}
		$.setAudio( { "instanceId": instance, "playbackRate": rate } );
	} );
} );
"""

[[parameters]]
name = "instanceId"
type = "number"
description = "Instance ID returned from playAudio."

[[parameters]]
name = "volume"
type = "number"
description = "Volume (0-1)."
optional = true

[[parameters]]
name = "playbackRate"
type = "number"
description = "Speed and pitch within the instance's mode range."
optional = true

[[parameters]]
name = "pan"
type = "number"
description = "Stereo position from -1 (left) to 1 (right)."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
