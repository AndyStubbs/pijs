title = "onClick"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Registers a callback function for click events (mouse or touch)."
description = """
Registers a callback that runs when a pointer is pressed and released inside the hit box: the left mouse button, or a single touch. Each pointer clicks on its own.

A press inside the box starts the click, and the release inside the box runs the callback with the release data. A release outside the box, another mouse button, or a cancelled touch does not click. If no hitBox is given, the screen's size when the callback is registered is used.

once removes the callback before its first run.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.onClick( ( clickData ) => {
	$.setPosPx( clickData.x, clickData.y );
	$.print( `Clicked`, true );
} );
"""

[[parameters]]
name = "fn"
type = "function"
signature = "( clickData: ClickData, customData?: object ) => void"
description = "Callback function that receives (clickData, customData)."

[[parameters]]
name = "once"
type = "boolean"
description = "If true, this registration is removed before the callback's first run."
optional = true

[[parameters]]
name = "hitBox"
type = "HitBox"
description = "Optional area the press and release must both be inside. Defaults to the screen."
optional = true

[[parameters]]
name = "customData"
type = "any"
description = "Optional custom data passed to the callback function."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
