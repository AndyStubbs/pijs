title = "setContextMenu"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Enables or disables the right-click context menu."
description = """
Controls whether the browser's context menu opens on the screen canvas. The menu is suppressed when the screen is created, so right-clicks reach the mouse callbacks. Pass true to let the menu open. set( { "contextMenu": ... } ) calls this command.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.print( "Right-click to open the context menu." );
$.setContextMenu( true );
"""

[[parameters]]
name = "isEnabled"
type = "boolean"
description = "If true, the context menu opens. If false, it is suppressed."

[[returns]]
type = "void"
description = "This function does not return a value."
