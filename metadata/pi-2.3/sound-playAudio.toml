title = "playAudio"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Plays loaded audio as a new instance and returns its instance ID."
description = """
Starts a new instance of audio loaded with loadAudio and returns its instance ID. Use the ID with stopAudio, pauseAudio, resumeAudio, and setAudio. Decoded audio can play many instances at once. Streamed audio plays one instance at a time: a new playAudio replaces the current one.

duration and startTime are in the file's own time. A duration of 0 plays to the end, or loops forever when loop is set. playbackRate changes speed and pitch together. pan places the instance from -1 (left) to 1 (right). delay waits before the instance starts.

Until the page gets its first click, key, or touch, a one-shot plays nothing. A looping instance starts when audio unlocks.
"""
example = """
$.screen( "300x200" );
const bomb = $.loadAudio( "media/bomb.wav" );
$.ready( function () {
	$.print( "Press any key to play bomb sound." );
	$.onKey( "any", "down", () => {
		$.print( "BOOM ", true );
		$.playAudio( {
			"audioId": bomb, "playbackRate": 0.75 + Math.random() * 0.5,
			"pan": Math.random() * 2 - 1
		} );
	}, false, true );
} );
"""

[[parameters]]
name = "audioId"
type = "string"
description = "Audio ID returned from loadAudio."

[[parameters]]
name = "volume"
type = "number"
description = "Volume (0-1, default: 1)."
optional = true

[[parameters]]
name = "startTime"
type = "number"
description = "Offset into the file in seconds (default: 0)."
optional = true

[[parameters]]
name = "duration"
type = "number"
description = "Seconds of the file to play, including every loop pass (default: 0 = to the end, or forever when looping)."
optional = true

[[parameters]]
name = "loop"
type = "boolean"
description = "Loop the whole file (default: false)."
optional = true

[[parameters]]
name = "playbackRate"
type = "number"
description = "Speed and pitch: 0.0625-16 for decoded audio, 0.25-4 for streamed audio (default: 1)."
optional = true

[[parameters]]
name = "pan"
type = "number"
description = "Stereo position from -1 (left) to 1 (right) (default: 0)."
optional = true

[[parameters]]
name = "delay"
type = "number"
description = "Seconds before playback starts (default: 0)."
optional = true

[[returns]]
type = "number"
description = "Instance ID for use with stopAudio, pauseAudio, resumeAudio, and setAudio."
