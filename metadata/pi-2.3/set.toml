title = "set"
category = "core"
isScreen = true
summary = "Applies multiple settings in a single call using an options object."
description = """
Sets one or more settings in one call. Any setX command is available as an option with the first letter lowercased, such as setColor as "color", including settings from loaded plugins.

Screen settings apply to the active screen. A "screen" option makes that screen active for the settings after it. Options set to null are skipped.
"""
example = """
$.screen( "300x200" );
$.set( { "color": 10, "font": 2, "pos": { "col": 5, "row": 5 }, "bgColor": "#267" } );
$.print( "Settings have been applied" );
"""

[[parameters]]
name = "options"
type = "Options"
description = "Object whose keys map to available settings (e.g., { \"color\": 2, \"font\": 1 })."

[[returns]]
type = "void"
description = "This function does not return a value."
