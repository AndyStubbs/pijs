title = "set"
category = "core"
isScreen = true
summary = "Applies multiple settings in a single call using an options object."
description = """
Sets one or more global or screen-scoped settings. Any command registered as a "setX" command
is available as an option with the lowercased name (e.g., setColor => { "color": ... }),
including the settings of loaded plugins.

Behavior:
- May be called before or after a screen exists; screen-scoped settings are applied to the active
  screen. A "screen" option makes its screen active for the settings after it.
- Settings routed to non-screen commands are applied globally.
- Options set to null are skipped.
- Every option name is checked before any setting is applied. A name that is not a setting,
  including a setting of a plugin that is not loaded, throws a RangeError with code
  INVALID_OPTION, and options that are not an object throw a TypeError with code
  INVALID_OPTIONS. A screen setting with no active screen throws NO_ACTIVE_SCREEN.
"""
example = """
$.screen( "300x200" );
$.set( { "color": 10, "font": 2, "pos": { "col": 5, "row": 5 }, "bgColor": "#267" } );
$.print( "Settings have been applied" );
"""

[[parameters]]
name = "options"
type = "Options"
description = "Object whose keys map to available settings (e.g., { \"color\": 2, \"font\": 1 })."

[[returns]]
type = "void"
description = "This function does not return a value."
