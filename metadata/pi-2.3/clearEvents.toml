title = "clearEvents"
category = "core"
isScreen = true
summary = "Clears events from all plugins or a specific plugin event type."
description = """
Clears queued/registered events. If type is provided, clears only that event type; otherwise clears
events for all registered types.

$.clearEvents() clears per-screen handlers on every screen. A screen's clearEvents(), such as
screen.clearEvents(), clears them on that screen only.

The pointer plugin registers "mouse", "touch", "press", "click", and "wheel", each clearing only
the handlers of its command: onMouse, onTouch, onPress, onClick, and onWheel. These handlers are
per-screen. The gamepad plugin registers "gamepad", which removes every onGamepad() callback,
whichever form is called. The keyboard plugin registers "keyboard", which removes every onKey()
handler, whichever form is called; $.clearEvents() also cancels every input() prompt, and a
screen's clearEvents() cancels only that screen's prompt. Clearing handlers does not stop tracking
or polling.
"""
example = """
$.screen( "300x200" );
$.print( "Move mouse or touch to paint screen click/touch up to stop." );
$.onPress( "move", pressMove );
$.onPress( "up", pressStop );

// Press move function
function pressMove( data ) {
	$.setPosPx( data.x, data.y );
	var pos = $.getPos();
	$.setPos( pos.col, pos.row );
	$.setColor( 8 );
	$.print( "+", true );
}

// Press stop function
function pressStop() {
	$.setColor( 14 );
	var pos = $.getPos();
	$.setPos( pos.col - 4, pos.row );
	$.print( "Stopped!", true );
	$.clearEvents();
}
"""

[[parameters]]
name = "type"
type = "string"
description = "Optional type to clear (e.g., \"keyboard\", \"mouse\", \"click\", \"gamepad\")."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
