title = "vibrateGamepad"
category = "gamepad"
isScreen = false
plugin = "gamepad"
summary = "Rumbles a gamepad's vibration motors."
description = """
Plays the "dual-rumble" effect of the pad's vibration actuator for duration milliseconds, with
the strong (low-frequency) and weak (high-frequency) motors at the given magnitudes. Returns true
when the pad supports the effect and false when it does not, such as in Firefox and iOS Safari,
or when no pad has the index; nothing plays then. Browsers may cap the duration, and a new effect
replaces one that is still playing; a duration of 0 stops the rumble.

Vibration reads the browser's pad directly, so it needs no polling and does not start it. The
gamepadIndex is a non-negative integer (INVALID_INDEX); duration is a finite number that is not
negative (INVALID_DURATION); strong and weak are finite numbers from 0 to 1, and 1 when omitted
(INVALID_STRONG, INVALID_WEAK). A value of the wrong type throws a TypeError, and one out of
range a RangeError.
"""
example = """
$.screen( "300x200" );
$.print( "Press the south button to rumble" );
function run() {
	const gamepad = $.inGamepad( 0 );
	if( gamepad && gamepad.getButtonJustPressed( "south" ) ) {
		if( !$.vibrateGamepad( 0, 200, 1, 0.5 ) ) {
			$.print( "This gamepad cannot rumble in this browser" );
		}
	}
	requestAnimationFrame( run );
}
run();
"""

[[parameters]]
name = "gamepadIndex"
type = "number"
description = "Index of the pad to rumble."

[[parameters]]
name = "duration"
type = "number"
description = "Rumble length in milliseconds."

[[parameters]]
name = "strong"
type = "number"
description = "Strong (low-frequency) motor magnitude from 0 to 1. The default is 1."
optional = true

[[parameters]]
name = "weak"
type = "number"
description = "Weak (high-frequency) motor magnitude from 0 to 1. The default is 1."
optional = true

[[returns]]
type = "boolean"
description = "True when the pad supports the dual-rumble effect and it was started."
