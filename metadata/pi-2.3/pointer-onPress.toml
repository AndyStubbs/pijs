title = "onPress"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Registers a callback function for press events (mouse or touch)."
description = """
Registers a callback for the primary pointer, either the mouse or the primary touch. Other touches are available from onTouch() and inTouch(). With a hitBox, the callback runs only for events inside it.

'down', 'move', and 'up' follow that pointer. 'up' also runs with cancelled set to true for a release the player did not make. A press that starts on the canvas border or padding is ignored.

once removes the callback before its first run. Registering starts mouse and touch tracking unless they were stopped.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.onPress( "down", ( pressData ) => {
	$.setPosPx( pressData.x, pressData.y );
	$.print( `(${pressData.x}, ${pressData.y})` );
} );

// With hit box
const hitBox = { "x": 10, "y": 10, "width": 100, "height": 50 };
$.setColor( 2 );
$.rect( hitBox );
$.setColor( 7 );
$.onPress( "move", ( pressData ) => {
	$.setColor( 3 );
	$.pset( pressData.x, pressData.y );
	$.setColor( 7 );
}, false, hitBox );

// One-time handler
$.onPress( "up", () => {
	$.setPos( 0, 12 )
	$.print( "press released once", true, true );
}, true );
"""

[[parameters]]
name = "mode"
type = "string"
description = "Event mode: 'down', 'up', or 'move'."

[[parameters]]
name = "fn"
type = "function"
signature = "( pressData: PressData, customData?: object ) => void"
description = "Callback function that receives (pressData, customData)."

[[parameters]]
name = "once"
type = "boolean"
description = "If true, this registration is removed before the callback's first run."
optional = true

[[parameters]]
name = "hitBox"
type = "HitBox"
description = "Optional area; the callback runs only for presses inside it."
optional = true

[[parameters]]
name = "customData"
type = "any"
description = "Optional custom data passed to the callback function."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
