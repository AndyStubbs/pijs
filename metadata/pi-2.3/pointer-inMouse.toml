title = "inMouse"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Gets the current mouse state and starts tracking if needed."
description = """
Returns the mouse data from the latest mouse event, or null before the first event and while tracking is stopped. The first call starts tracking unless stopMouse() was called.

Only buttons pressed on the screen are counted. A drag that ends outside the canvas still releases its button.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
requestAnimationFrame( run );
function run() {
	const mouse = $.inMouse();

	// Draw while a button is held; there is no mouse data before the first event
	if( mouse !== null && mouse.buttons > 0 ) {
		$.setColor( 14 );
		$.line( mouse.lastX, mouse.lastY, mouse.x, mouse.y );
	}
	requestAnimationFrame( run );
}
"""

[[returns]]
type = "MouseData | null"
description = "Frozen mouse data of the latest event, or null before it and while stopped."
