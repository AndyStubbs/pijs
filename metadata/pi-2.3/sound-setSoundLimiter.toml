title = "setSoundLimiter"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Turns the output limiter on or off."
description = """
Keeps the combined output of sounds, music, and audio from clipping. It is on by default. Levels below its threshold pass through unchanged. Set it before playback starts.
"""
example = """
$.screen( "300x200" );
$.print( "Press any key to hear a chord without the limiter" );
$.setSoundLimiter( false );
$.setVolume( 0.2 );
$.onKey( "any", "down", () => {
	$.sound( 262, 1, 0.5 );
	$.sound( 330, 1, 0.5 );
	$.sound( 392, 1, 0.5 );
} );
"""

[[parameters]]
name = "enabled"
type = "boolean"
description = "True to limit output (the default), false to bypass the limiter."

[[returns]]
type = "void"
description = "This function does not return a value."
