title = "offClick"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Removes a click event handler."
description = """
Removes the click handler registered with the function; the once, hitBox, and customData it was
registered with do not matter. Click has one mode, so if fn is omitted or null, removes every click
handler of the screen. A handler removed during an event does not run later in it.
"""
example = """
$.screen( "300x200" );
const handler = ( clickData ) => {
	$.setPosPx( clickData.x, clickData.y );
	$.setColor( 3 );
	$.print( "Clicked!", true );
};
$.onClick( handler );
let countDown = 5;
const interval = setInterval( () => {
	$.setColor( 7 );
	$.setPos( 0, 5 - countDown );
	$.print( `Count down to offClick: ${countDown}` );
	countDown -= 1;
	if( countDown === -1 ) {
		$.print( "Click is now disabled!" );
		clearInterval( interval );
		$.offClick( handler );
	}
}, 1000 );
"""

[[parameters]]
name = "fn"
type = "function"
signature = "( clickData: ClickData, customData?: object ) => void"
description = "Callback function to remove. If omitted or null, removes every click handler."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
