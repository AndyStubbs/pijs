title = "inPress"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Gets the current press state (mouse or touch) and starts tracking if needed."
description = """
Returns the press of the primary pointer, from whichever was used last: the mouse, or the primary touch. A touch is primary when it starts with no other touch down, and stays primary until it lifts. Returns null before the first event, and while the input of the latest press is stopped.

The first call starts mouse and touch tracking unless they were stopped.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.setPinchZoom( false );
requestAnimationFrame( run );
function run() {
	const press = $.inPress();

	// Draw while pressed; there is no press data before the first event
	if( press !== null && press.buttons > 0 ) {
		$.setColor( 15 );
		$.line( press.lastX, press.lastY, press.x, press.y );
	}
	requestAnimationFrame( run );
}
"""

[[returns]]
type = "PressData | null"
description = "Frozen press data of the primary pointer, from the mouse or touch, or null."
