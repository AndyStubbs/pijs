title = "screen"
category = "core"
isScreen = false
summary = "Creates a new screen (canvas) with specified dimensions and aspect ratio."
description = """
Creates a screen, makes it the active drawing target, and returns its Screen API. Call it before drawing.

aspect uses (width)(x|e|m)(height):

- x: exact pixel size, such as "320x200"
- e: fill the container while keeping the aspect ratio, such as "320e200"
- m: scale by whole multiples of the size, such as "320m200"

An offscreen screen uses exact pixels only. Give it a parent screen so drawImage can copy from it directly. After creating an offscreen screen, call setScreen on the visible screen before reading pointer input.
"""
example = """
const parent = $.screen( { "aspect": "320x200" } );
const offscreen = $.screen( {
	"aspect": "160x100",
	"isOffscreen": true,
	"parent": parent
} );

$.cls( 1 );
$.circle( 80, 50, 32, "red" );

$.setScreen( parent );
$.drawImage( offscreen, 80, 50 );
"""

[[parameters]]
name = "aspect"
type = "string"
description = "Aspect ratio string in format (width)(x|e|m)(height), e.g., '300x200', '100e00', '300m200'."

[[parameters]]
name = "container"
type = "string | HTMLElement"
typeDesc = "*Many"
description = "DOM element or element ID string to use as container. Defaults to document.body."
optional = true

[[parameters]]
name = "isOffscreen"
type = "boolean"
description = "If true, creates an offscreen canvas that is not displayed. Requires exact pixel dimensions."
optional = true

[[parameters]]
name = "resizeCallback"
type = "function"
signature = "( screenApi: Screen, fromSize: Size, toSize: Size ) => void"
description = "Callback function called when screen is resized. Receives (screenApi, fromSize, toSize)."
optional = true

[[parameters]]
name = "parent"
type = "number | Screen"
typeDesc = "*Many"
description = "Existing screen to share drawing with. Only for an offscreen screen. Makes drawImage from that screen faster."
optional = true

[[parameters]]
name = "noCss"
type = "boolean"
description = "If true, Pi.js does not set canvas or page styles. Supply the canvas layout in your own CSS."
optional = true

[[returns]]
type = "Screen"
description = "Screen API object with all graphics command and screen=true and id property."
