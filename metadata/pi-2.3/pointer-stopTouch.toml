title = "stopTouch"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Stops touch input tracking for this screen."
description = """
Stops touch tracking on the screen canvas. Held touches are released first: the onTouch 'up'
handlers, and the onPress 'up' handlers for the primary touch, run with cancelled set to true, and
no click fires.

While stopped, handlers stay registered but are not called, and inTouch() returns the last state.
Reads and handler registration do not restart tracking; call startTouch().
"""
example = """
$.screen( "300x200" );
$.print( "Touch will be stopped in 3 seconds." );
$.onTouch( "move", ( touches ) => {
	const touch = touches[ 0 ];
	$.setPosPx( touch.x, touch.y );
	var pos = $.getPos();
	$.setPos( pos.col, pos.row );
	$.setColor( 13 );
	$.print( "+", true );
} );
setTimeout( () => {
	$.setPos( 0, 1 );
	$.setColor( 7 );
	$.print( "Touch is stopped" );
	$.stopTouch();
}, 3000 );
"""

[[returns]]
type = "void"
description = "This function does not return a value."
