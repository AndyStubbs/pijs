title = "setGamepadSensitivity"
category = "gamepad"
isScreen = false
plugin = "gamepad"
summary = "Sets the dead zone sensitivity for gamepad analog sticks."
description = """
Sets the dead zone applied to every gamepad axis, to hide stick drift. The default is 0.2. An
axis value whose size is below the dead zone reads 0; a larger value is scaled so that it
starts from 0 at the edge of the dead zone and still reaches 1 at full tilt. Each axis is
handled on its own.

The value must be a number from 0 to 1: 0 means no dead zone, and 1 is treated as 0.99999.
Anything else throws a TypeError with code INVALID_PARAMETERS and keeps the previous setting.
The new dead zone applies from the next update. It can also be set with
set( { "gamepadSensitivity": value } ).
"""
example = """
$.screen( "300x200" );
$.setGamepadSensitivity( 0.2 );
run();
function run() {
	const gamepad = $.inGamepad( 0 );
	if( gamepad ) {
		const vAxis = gamepad.getAxis( 0 );
		$.cls();
		$.circle( Math.floor( 300 * ( vAxis / 2 ) ) + 150, 100, 8 );
	}
	requestAnimationFrame( run );
}
"""

[[parameters]]
name = "sensitivity"
type = "number"
description = "Dead zone from 0 to 1 (0 = no dead zone). The default is 0.2."

[[returns]]
type = "void"
description = "This function does not return a value."
