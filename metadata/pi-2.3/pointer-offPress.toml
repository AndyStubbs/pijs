title = "offPress"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Removes a press event handler."
description = """
Removes press event handlers registered with onPress. A handler is identified by its mode and
callback; the once, hitBox, and customData it was registered with do not matter.

With a mode and a callback, removes that handler. Without a callback, removes every handler of the
mode. With a callback and no mode (null, or no mode in the object form), removes the callback from
every mode. Omitting both throws a TypeError with code INVALID_MODE; clearEvents( "press" ) removes
every press handler.

A handler removed during an event does not run later in it.

The mode and callback are checked as onPress() checks them, with codes INVALID_MODE and
INVALID_FUNCTION.
"""
example = """
$.screen( "300x200" );
$.print( "Move mouse or touch to paint screen, click/touch up to stop." );
$.onPress( "move", pressMove );
$.onPress( "up", pressStop, true );

// Press move function receives pressData and optional customData
function pressMove( pressData, customData ) {
	$.setPosPx( pressData.x, pressData.y );
	var pos = $.getPos();
	$.setPos( pos.col, pos.row );
	$.setColor( 8 );
	$.print( "+", true );
}

// Press stop function receives pressData and optional customData
function pressStop( pressData, customData ) {
	$.setColor( 14 );
	var pos = $.getPos();
	$.setPos( pos.col - 4, pos.row );
	$.print( "Stopped!", true );
	$.offPress( "move", pressMove );
}
"""

[[parameters]]
name = "mode"
type = "string | null"
description = "Mode ('down', 'up', or 'move'); if omitted or null, fn is removed from every mode."
optional = true

[[parameters]]
name = "fn"
type = "function"
signature = "( pressData: PressData, customData?: object ) => void"
description = "Callback function to remove. If omitted or null, removes every handler of the mode."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
