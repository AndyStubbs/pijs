title = "startTouch"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Starts touch input tracking for this screen."
description = """
Starts touch tracking. Tracking also starts on the first inTouch(), inPress(), or touch callback, so this is only needed after stopTouch(). While tracking, the browser does not scroll or zoom from touches on the canvas. Calling it while tracking is already running does nothing.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
$.stopTouch();
$.print( "Touch will be enabled in 3 seconds." );
$.onTouch( "move", ( touches ) => {
	const touch = touches[ 0 ];
	$.setPosPx( touch.x, touch.y );
	var pos = $.getPos();
	$.setPos( pos.col, pos.row );
	$.setColor( 13 );
	$.print( "+", true );
} );
setTimeout( () => {
	$.setPos( 0, 1 );
	$.setColor( 7 );
	$.print( "Touch is enabled" );
	$.startTouch();
}, 3000 );
"""

[[returns]]
type = "void"
description = "This function does not return a value."
