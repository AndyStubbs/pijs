title = "sound"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Plays a synthesized sound with an ADSR envelope using Web Audio API."
description = """
Plays a tone or noise with an ADSR envelope. The attack rises to volume, the decay falls to the sustain level, the sustain holds until duration ends, and the release fades to silence. The sound lasts for duration plus the release.

oType selects the waveform: triangle, sine, square, sawtooth, white noise, pink noise, or a custom wavetable. frequencyEnd sweeps the pitch from frequency to frequencyEnd over duration. pan places the sound from -1 (left) to 1 (right). Noise ignores frequency.

Until the page gets its first click, key, or touch, calls return an ID but play nothing.
"""
example = """
const data = [
  392, 8, "My ", 659, 8, "Bon-", 587, 8, "nie ", 523, 8, "lies ", 587, 8,
  "o-", 523, 8, "ver ", 440, 8, "the ", 392, 8, "o-", 330, 32, "cean\\n",
  392, 8, "My ", 659, 8, "Bon-", 587, 8, "nie ", 523, 8, "lies ", 523, 8,
  "o-", 494, 8, "ver ", 523, 8, "the ", 587, 40, "sea\\n", 392, 8, "My ",
  659, 8, "Bon-", 587, 8, "nie", 523, 8, " lies ", 587, 8, "o-", 523, 8,
  "ver ", 440, 8, "the ", 392, 8, "o-", 330, 32, "cean\\n", 392, 8, "Oh ",
  440, 8, "bring ", 587, 8, "back ", 523, 8, "my ", 494, 8, "Bon-", 440,
  8, "nie ", 494, 8, "to ", 523, 32, "me"
];
const printTimeouts = [];

let totalDuration = 0;
$.screen( "300x200" );
$.print( "Press any key to hear the song" );
$.onKey( "any", "down", () => {
	for( let i = 0; i < data.length; i += 3 ) {
		const length = data[ i + 1 ] / 18.2;
		const word = data[ i + 2 ];
		$.sound( {
			"frequency": data[ i ],
			"duration": length * 0.9,
			"volume": 0.15,
			"oType": "sawtooth",
			"delay": totalDuration,
			"attackTime": length * 0.01,
			"decayTime": length * 0.3,
			"sustainLevel": 0.7,
			"releaseTime": length * 0.1
		} );
		printWord( word, totalDuration );
		totalDuration += length;
	}
} );

function printWord( word, delay ) {
	printTimeouts.push( setTimeout( function () {
		$.print( word, word.indexOf( "\\n" ) === -1 );
	}, delay * 1000 ) );
}
"""

[[parameters]]
name = "frequency"
type = "number"
description = "Frequency in Hz; no effect on noise (default: 440)."
optional = true

[[parameters]]
name = "duration"
type = "number"
description = "Gate length in seconds: how long the sound is held before the release begins (default: 1)."
optional = true

[[parameters]]
name = "volume"
type = "number"
description = "Peak volume 0-1 (default: 1)."
optional = true

[[parameters]]
name = "oType"
type = "string | array"
typeDesc = "*Many"
description = "Oscillator type: 'triangle', 'sine', 'square', 'sawtooth', 'white' or 'pink' noise, a source type added by a plugin (such as 'periodic' from sound-advanced), or custom wavetable array [[realArray], [imagArray]] (default: 'triangle')."
optional = true

[[parameters]]
name = "delay"
type = "number"
description = "Delay before playing in seconds (default: 0)."
optional = true

[[parameters]]
name = "attackTime"
type = "number"
description = "Seconds from silence to the peak volume (default: 0)."
optional = true

[[parameters]]
name = "decayTime"
type = "number"
description = "Seconds from the peak to the sustain level (default: 0)."
optional = true

[[parameters]]
name = "sustainLevel"
type = "number"
description = "Fraction of the peak volume held until duration ends, 0-1 (default: 1)."
optional = true

[[parameters]]
name = "releaseTime"
type = "number"
description = "Seconds from the sustain level to silence after duration ends (default: 0.1)."
optional = true

[[parameters]]
name = "pan"
type = "number"
description = "Stereo position from -1 (left) to 1 (right) (default: 0)."
optional = true

[[parameters]]
name = "frequencyEnd"
type = "number"
description = "Frequency in Hz to sweep to exponentially over duration; no effect on noise (default: no sweep)."
optional = true

[[returns]]
type = "string"
description = "Sound ID for use with stopSound."
