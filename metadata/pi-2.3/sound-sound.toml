title = "sound"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Plays a synthesized sound with an ADSR envelope using Web Audio API."
description = """
Generates and plays a sound at a specific frequency using Web Audio API oscillators. Supports standard waveforms (triangle, sine, square, sawtooth), custom wavetables, and white or pink noise. Frequency is not rounded.

The volume follows an ADSR envelope. The attack ramps linearly from silence to the peak volume over attackTime. The decay then falls toward sustainLevel × volume over decayTime, and the sustain holds until duration ends. The release fades from that level to silence over releaseTime. If duration ends before the attack and decay finish, the release starts from the level reached at that point. The total length is duration plus the release. Every onset and stop ramps over at least 3 ms, even when attackTime or releaseTime is 0, so sounds start and end without clicks.

pan places the sound from -1 (left) to 1 (right). The louder channel always plays at volume, so a sound panned near center is as loud as an unpanned one, and the channels keep an equal-power balance. frequencyEnd sweeps the pitch exponentially from frequency to frequencyEnd over duration; both must then be greater than 0, or the call throws INVALID_FREQUENCY.

The "white" and "pink" types play noise instead of a tone. White noise has equal energy at every frequency; pink noise falls by 3 dB per octave, which sounds deeper and softer. Each noise type loops one shared 2-second buffer, and every sound starts it at a random position so repeated hits do not sound identical. frequency and frequencyEnd have no effect on noise, though a sweep's values are still validated.

Sounds play on the sound-effects bus through the master volume and the output limiter. A delay beyond the 0.2 second lookahead window is held as a pending request until its start approaches. At most 1024 requests can be pending; beyond that the call throws TOO_MANY_PENDING_SOUNDS. At most 64 sounds hold voice slots at once; when all are in use, the oldest overlapping sound fades out to make room.

Until the page receives its first user gesture (pointer, key, or touch), the browser keeps audio locked. Calls made while audio is locked return an ID but play nothing; audio unlocks on the first gesture.
"""
example = """
const data = [
  392, 8, "My ", 659, 8, "Bon-", 587, 8, "nie ", 523, 8, "lies ", 587, 8,
  "o-", 523, 8, "ver ", 440, 8, "the ", 392, 8, "o-", 330, 32, "cean\\n",
  392, 8, "My ", 659, 8, "Bon-", 587, 8, "nie ", 523, 8, "lies ", 523, 8,
  "o-", 494, 8, "ver ", 523, 8, "the ", 587, 40, "sea\\n", 392, 8, "My ",
  659, 8, "Bon-", 587, 8, "nie", 523, 8, " lies ", 587, 8, "o-", 523, 8,
  "ver ", 440, 8, "the ", 392, 8, "o-", 330, 32, "cean\\n", 392, 8, "Oh ",
  440, 8, "bring ", 587, 8, "back ", 523, 8, "my ", 494, 8, "Bon-", 440,
  8, "nie ", 494, 8, "to ", 523, 32, "me"
];
const printTimeouts = [];

let totalDuration = 0;
$.screen( "300x200" );
$.print( "Press any key to hear the song" );
$.onkey( "any", "down", () => {
	for( let i = 0; i < data.length; i += 3 ) {
		const length = data[ i + 1 ] / 18.2;
		const word = data[ i + 2 ];
		$.sound( {
			"frequency": data[ i ],
			"duration": length * 0.9,
			"volume": 0.15,
			"oType": "sawtooth",
			"delay": totalDuration,
			"attackTime": length * 0.01,
			"decayTime": length * 0.3,
			"sustainLevel": 0.7,
			"releaseTime": length * 0.1
		} );
		printWord( word, totalDuration );
		totalDuration += length;
	}
} );

function printWord( word, delay ) {
	printTimeouts.push( setTimeout( function () {
		$.print( word, word.indexOf( "\\n" ) === -1 );
	}, delay * 1000 ) );
}
"""

[[parameters]]
name = "frequency"
type = "number"
description = "Frequency in Hz; no effect on noise (default: 440)."
optional = true

[[parameters]]
name = "duration"
type = "number"
description = "Gate length in seconds: how long the sound is held before the release begins (default: 1)."
optional = true

[[parameters]]
name = "volume"
type = "number"
description = "Peak volume 0-1 (default: 1)."
optional = true

[[parameters]]
name = "oType"
type = "string | array"
typeDesc = "*Many"
description = "Oscillator type: 'triangle', 'sine', 'square', 'sawtooth', 'white' or 'pink' noise, or custom wavetable array [[realArray], [imagArray]] (default: 'triangle')."
optional = true

[[parameters]]
name = "delay"
type = "number"
description = "Delay before playing in seconds (default: 0)."
optional = true

[[parameters]]
name = "attackTime"
type = "number"
description = "Seconds from silence to the peak volume (default: 0; at least 3 ms is always used)."
optional = true

[[parameters]]
name = "decayTime"
type = "number"
description = "Seconds from the peak to the sustain level (default: 0)."
optional = true

[[parameters]]
name = "sustainLevel"
type = "number"
description = "Fraction of the peak volume held until duration ends, 0-1 (default: 1)."
optional = true

[[parameters]]
name = "releaseTime"
type = "number"
description = "Seconds from the sustain level to silence after duration ends (default: 0.1; at least 3 ms is always used)."
optional = true

[[parameters]]
name = "pan"
type = "number"
description = "Stereo position from -1 (left) to 1 (right); the louder channel stays at volume (default: 0)."
optional = true

[[parameters]]
name = "frequencyEnd"
type = "number"
description = "Frequency in Hz to sweep to exponentially over duration; no effect on noise (default: no sweep)."
optional = true

[[returns]]
type = "string"
description = "Sound ID for use with stopSound."
