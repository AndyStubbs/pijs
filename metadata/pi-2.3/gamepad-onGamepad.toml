title = "onGamepad"
category = "gamepad"
isScreen = false
plugin = "gamepad"
summary = "Registers a callback function for gamepad connections or disconnections."
description = """
Registers a callback for gamepad connections or disconnections.

The 'connect' mode runs when a gamepad connects and receives that gamepad's GamepadData. It also receives each gamepad already connected when it is registered, in index order, once per connection.

The 'disconnect' mode runs when a gamepad disconnects and receives GamepadDisconnectData. By then the gamepad has left the list that inGamepad() returns.

With once, the callback is removed before its first run. Registering starts polling unless stopGamepad() was called.
"""
example = """
$.screen( "300x200" );
$.print( "Connect gamepad and press a button or move an axis to connect" );
$.onGamepad( "connect", ( gamepad ) => {
	$.print( `Gamepad ${gamepad.index} connected: ${gamepad.id}` );
} );
$.onGamepad( "disconnect", ( data ) => {
	$.print( `Gamepad ${data.index} disconnected: ${data.id}` );
} );
"""

[[parameters]]
name = "mode"
type = "string"
description = "Event mode: 'connect' or 'disconnect'."

[[parameters]]
name = "fn"
type = "function"
signature = "( data: GamepadData | GamepadDisconnectData ) => void"
description = "Callback that receives GamepadData or GamepadDisconnectData, by mode."

[[parameters]]
name = "once"
type = "boolean"
description = "If true, this registration is removed before the callback's first run."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
