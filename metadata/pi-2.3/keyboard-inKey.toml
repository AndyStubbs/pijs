title = "inKey"
category = "keyboard"
isScreen = false
plugin = "keyboard"
summary = "Gets the current state of a key or all pressed keys."
description = """
Retrieves key state information. If a key is provided, returns the key data object for that key
if it is currently pressed, or null if it is not. The key can be named by its code (e.g.,
"KeyA"), which names a physical key, or by its key value (e.g., "a"), which names the character
it types. A key value is held while any key that produced it is held, such as either Shift key
for "Shift"; the most recent press is returned.

If no key is provided, returns a frozen array of the key data objects of all pressed keys,
ordered by each key's latest keydown, or an empty array. The same array is returned until a key is
pressed or released, so reading it every frame does not allocate.

The first call starts keyboard tracking, unless stopKeyboard() was called; keys pressed before
tracking starts are not reported. Keys typed into an input() prompt are not reported either.

Key data objects contain: code, key, location, altKey, ctrlKey, metaKey, shiftKey, repeat,
cancelled. They are frozen.

A key that is not a string throws a TypeError, and an empty string a RangeError, with code
INVALID_KEY; null is the same as no key.
"""
example = """
$.screen( "300x200" );
requestAnimationFrame( run );
function run() {
	const keys = $.inKey();
	$.cls();
	$.print( "Press any key" );
	for( const keyData of keys ) {
		$.print( "--------------------------" );
		$.print( "key:      " + keyData.key );
		$.print( "location: " + keyData.location );
		$.print( "code:     " + keyData.code );
	}
	requestAnimationFrame( run );
}
"""

[[parameters]]
name = "key"
type = "string"
description = "Key code or key value to check. If omitted, returns all pressed keys."
optional = true

[[returns]]
type = "object | array | null"
typeDesc = "*Many"
description = "Key data object if key is pressed, array of all pressed keys if no key specified, or null if key not pressed."
