title = "removeAudio"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Removes loaded audio and frees its resources."
description = """
Removes audio loaded with loadAudio. A load still in progress is cancelled. Playing instances fade out, and the audio ID can be reused by a later loadAudio.
"""
example = """
$.screen( "300x200" );
let bombAudio = $.loadAudio( "media/bomb.wav" );
$.ready( function () {
	$.print( "Press any key to try to play bomb sound." );
	$.removeAudio( bombAudio );
	$.onKey( "any", "down", () => {
		try {
			$.playAudio( bombAudio );
		} catch (e) {
			$.print( "SILENCE ", true );
		}
	}, false, true );
} );
"""

[[parameters]]
name = "audioId"
type = "string"
description = "Audio ID returned from loadAudio."

[[returns]]
type = "void"
description = "This function does not return a value."
