title = "onWheel"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Registers a callback function for mouse wheel and trackpad scroll events."
description = """
Registers a callback for mouse wheel and trackpad scroll events over the canvas. The callback receives the wheel data and any custom data. With a hitBox, it runs only for events inside it. Deltas are in CSS pixels.

While a wheel callback is registered, the page does not scroll from the wheel over the canvas. When the last one is removed, the page scrolls again.

once removes the callback before its first run.

Requires an onscreen screen.
"""
example = """
$.screen( "300x200" );
let zoom = 1;
$.onWheel( ( wheelData ) => {

	// Zoom in when the wheel turns up, and out when it turns down
	zoom = Math.min( Math.max( zoom - wheelData.deltaY / 500, 0.25 ), 4 );
	$.cls();
	$.print( `Zoom: ${zoom.toFixed( 2 )}` );
} );
"""

[[parameters]]
name = "fn"
type = "function"
signature = "( wheelData: WheelData, customData?: object ) => void"
description = "Callback function that receives (wheelData, customData)."

[[parameters]]
name = "once"
type = "boolean"
description = "If true, this registration is removed before the callback's first run."
optional = true

[[parameters]]
name = "hitBox"
type = "HitBox"
description = "Optional area the wheel event must be inside. Defaults to the whole canvas."
optional = true

[[parameters]]
name = "customData"
type = "any"
description = "Optional custom data passed to the callback function."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
