title = "offTouch"
category = "pointer"
isScreen = true
plugin = "pointer"
summary = "Removes a touch event handler."
description = """
Removes callbacks registered with onTouch. A callback is identified by its mode and function.

With a mode and a function, removes that callback. Without a function, removes every callback of the mode. With a function and no mode, removes the function from every mode.
"""
example = """
$.screen( "300x200" );
$.print( "Touch and drag to paint screen, touch up to stop." );
$.onTouch( "move", touchMove );
$.onTouch( "up", touchStop, true );

// Touch move function receives the touches that moved and optional customData
function touchMove( touches, customData ) {
	$.setPosPx( touches[ 0 ].x, touches[ 0 ].y );
	var pos = $.getPos();
	$.setPos( pos.col, pos.row );
	$.setColor( 8 );
	$.print( "+", true );
}

// Touch stop function receives the touches that ended and optional customData
function touchStop( touches, customData ) {
	$.setColor( 14 );
	var pos = $.getPos();
	$.setPos( pos.col - 4, pos.row );
	$.print( "Stopped!", true );
	$.offTouch( "move", touchMove );
}
"""

[[parameters]]
name = "mode"
type = "string | null"
description = "Mode ('down', 'up', or 'move'); if omitted or null, fn is removed from every mode."
optional = true

[[parameters]]
name = "fn"
type = "function"
signature = "( touches: Array<TouchData>, customData?: object ) => void"
description = "Callback function to remove. If omitted or null, removes every handler of the mode."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
