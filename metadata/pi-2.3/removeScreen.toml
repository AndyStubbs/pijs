title = "removeScreen"
category = "core"
isScreen = false
summary = "Removes a screen and cleans up all associated resources."
description = """
Removes a screen and its canvas. After removal, calling methods on the screen throws.

Call it as $.removeScreen( screen ) or as screen.removeScreen().
"""
example = """
const screen1 = $.screen( "320x200" );
$.removeScreen( screen1 );

// Or call as method on screen object
const screen2 = $.screen( "640x480" );
screen2.removeScreen();
"""

# Each screen also has a parameterless removeScreen() that removes that screen
[screenForm]
summary = "Removes this screen and cleans up all associated resources."

[[parameters]]
name = "screen"
type = "number | Screen"
typeDesc = "*Many"
description = "Screen ID (number) or screen API object to remove. Required in the global form; the declaration marks it optional because each screen's own removeScreen() takes none."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."

