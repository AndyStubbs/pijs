title = "stopAudio"
category = "sound"
isScreen = false
plugin = "sound"
summary = "Stops an audio instance, every instance of an audio ID, or all audio."
description = """
Stops audio with a short fade. Pass an instance ID to stop one instance, an audio ID to stop every instance of that file, or nothing to stop all audio. An instance that has not started yet is cancelled.
"""
example = """
$.screen( "300x200" );
const audio = $.loadAudio( "media/sound.wav" );
$.ready( function () {
	$.print( "Press any key to hear sound" );
	$.onKey( "any", "down", () => {
		const instance = $.playAudio( audio );
		setTimeout( function () {
			$.stopAudio( instance );
		}, 500 );
	} );
} );
"""

[[parameters]]
name = "id"
type = "number | string"
description = "Instance ID, or audio ID to stop all its instances. If omitted, stops all audio."
optional = true

[[returns]]
type = "void"
description = "This function does not return a value."
